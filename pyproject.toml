[project]
name = "disaster-awareness-v2"
version = "0.1.0"
description = "Incident-first disaster awareness reference built on a Git-backed canonical record store"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "nullhack" }]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "pyright>=1.1.407",
]

[project.scripts]
disaster-v2-build = "disaster_v2.build:main"
disaster-v2-migrate = "disaster_v2.migrate:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
markers = [
    "slow: marks tests that scan the full local data tree",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C9"]
mccabe.max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
