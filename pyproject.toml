[project]
name = "disaster-awareness-v2"
version = "0.1.0"
description = "Incident-first disaster awareness reference built on a Git-backed canonical record store"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "nullhack" }]
dependencies = [
    "country-converter==1.3.2",
    "ddgs==9.14.4",
    "dspy==3.2.1",
    "httpx>=0.28.0",
    "iso3166-2==1.8.3",
    "litellm==1.91.0",
    "pandas==3.0.3",
    "pyyaml>=6.0.3",
    "trafilatura==2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "pyright>=1.1.407",
]

[project.scripts]
disaster-v2-build = "disaster_v2.build:main"
disaster-v2-migrate = "disaster_v2.migrate:main"
disaster-v2-ingest = "disaster_v2.pipeline:main_ingest"
disaster-v2-search-news = "disaster_v2.pipeline:main_search_news"
disaster-v2-generate-logs = "disaster_v2.pipeline:main_generate_logs"
disaster-v2-pipeline = "disaster_v2.pipeline:main_pipeline"
disaster-v2-submissions = "disaster_v2.submissions:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
markers = [
    "slow: marks tests that scan the full local data tree",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C9"]
mccabe.max-complexity = 16

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]
"src/disaster_v2/render.py" = ["E501"]
