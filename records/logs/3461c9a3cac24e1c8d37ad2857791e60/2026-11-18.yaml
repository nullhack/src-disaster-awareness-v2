summary: |-
  Vice President JD Vance vowed that the U.S. will not make a long-term commitment to the Iran war, according to a report. A separate analysis examined how Democrats may shift national security policy and oversight of the Iran war once they take over Congress.
  Iran widened its attacks on Gulf neighbors by targeting a US air base in Kuwait and sites in Bahrain after American strikes on Qeshm Island, while Tehran warned Washington against “miscalculation” and a tanker was hit. Saudi Arabia intercepted a Houthi cruise missile, and fighting in Yemen has made the Bab el-Mandeb crossing more dangerous. Separately, Democratic Rep. Ro Khanna proposed $1,700 refund checks for all US families to offset the Iran war’s economic impact, and the Trump-Xi-Putin summit was expected to address the conflict involving Iran.
