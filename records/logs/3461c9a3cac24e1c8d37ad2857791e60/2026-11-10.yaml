summary: |-
  Trump met Qatar's prime minister at the White House to discuss ending the Iran war, but Secretary of State Rubio warned negotiations are far from a breakthrough. Houthi rebels reported an airstrike near Sanaa that killed at least 44 people, mostly women and children. Additionally, container shipping rates from Asia to the U.S. West Coast have surged 343% since the conflict began, while oil prices fell to their lowest since August on hopes of a resolution.
  Defense Secretary Pete Hegseth continued to defend the Iran war as impeachment articles head toward a possible House vote. Additionally, global fossil fuel emissions are on track to fall slightly in 2026 because of the conflict's impact on oil and gas prices.
