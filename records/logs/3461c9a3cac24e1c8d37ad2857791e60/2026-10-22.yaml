summary: The Middle East conflict escalated, with the US ordering embassy evacuations in Saudi Arabia after deadly Houthi strikes and Iran reporting seven oil tankers set on fire in a key strait. Economic fallout includes an IMF forecast of a 1.3% contraction for the region and companies like Solvay cutting earnings guidance. Experts indicate further conflict is likely in the coming weeks.
