summary: |-
  The IEA's chief said the Iran war has produced the largest threat to energy security in history, warning the energy world will not return to its pre-war state. Shipping through the Strait of Hormuz continues to face Iranian restrictions, tanker attacks and a US naval blockade, with a $64 million insurance claim illustrating the maritime cost, while GlobalData assessed that the US stands to gain most from the conflict's reshaping of global LNG trade. Reporting also found that estimates of when the Gulf conflict will end differ sharply between Washington and Riyadh.
  A report said children in Gaza face displacement, loss of family, and poor living conditions. Separately, Tucker Carlson claimed that President Trump wants to de-escalate the Iran conflict, prompting Laura Loomer to dispute that account; she said Trump called Carlson a “loser.”
