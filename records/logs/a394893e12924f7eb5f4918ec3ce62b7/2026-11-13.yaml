summary: Cyclone Arnab has been identified as the first of two cyclones that struck the same region within six days, with Cyclone Murasu making landfall on November 3, 2026. This rare double strike has renewed discussions about climate change and the increasing vulnerability of the Bay of Bengal to sequential storms.
