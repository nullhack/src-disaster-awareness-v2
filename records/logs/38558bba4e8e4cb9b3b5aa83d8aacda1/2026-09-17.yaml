summary: As of September 17, Indonesian rescuers expanded the search for eight missing people—including five journalists—near Anak Krakatau across 10 sectors on day 10, but later formally called off the two-week search with no success. The development concludes the rescue operation for those who lost contact while covering the ongoing eruption.
