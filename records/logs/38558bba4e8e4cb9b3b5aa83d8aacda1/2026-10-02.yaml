summary: Two new island-like formations have emerged near Anak Krakatau following the volcano's 25-hour eruption, marking the first such occurrence since 1930. Satellite imagery shows the mounds positioned off opposite sides of the volcano, though experts say it is too early to confirm them as new volcanic landforms.
