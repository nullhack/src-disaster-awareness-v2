summary: Mount Anak Krakatau remains in an "incubation phase" according to Indonesia's BRIN, indicating ongoing volcanic activity. Additionally, several false videos and photos have circulated online, including AI-generated footage and a video from Hawaii misattributed to the eruption, as well as misleading claims about ash reaching Jakarta.
