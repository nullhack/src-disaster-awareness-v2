summary: Super Typhoon Champi has intensified into a super typhoon, according to Pagasa. It is now threatening Taiwan, with a less than 30% risk to Hong Kong, and is expected to enter the Philippine Area of Responsibility on Tuesday, October 20. The storm continues to strengthen in the western North Pacific.
