summary: Super Typhoon Champi approached Taiwan on Thursday, having slightly weakened from its Category 5 peak but remaining a powerful Category 4 storm. The system triggered warnings and the cancellation of dozens of flights, with authorities also flagging potential stock exchange closures. The region is bracing for heavy rain and strong winds within days as the storm continues toward Taiwan and eastern China.
