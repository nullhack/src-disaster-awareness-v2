summary: As of August 22, 2026, the France/Spain wildfires have burned 160,000 hectares, destroyed 450 homes, killed four firefighters, and destroyed 30 firefighting vehicles, according to an interview with a French firefighter. This update provides cumulative damage figures for the incident.
