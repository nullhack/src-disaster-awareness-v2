summary: China's Ministry of Water Resources warned on Tuesday that water levels in 10 rivers across Guangxi, Yunnan, Jiangsu and Xinjiang have exceeded warning thresholds, posing flood risks. Additionally, Catholic relief organizations, including Jinde Charities in China, are mobilizing to provide aid to communities affected by the severe flooding.
