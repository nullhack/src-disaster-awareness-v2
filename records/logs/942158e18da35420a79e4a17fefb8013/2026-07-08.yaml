summary: Heavy rainfall since mid-June triggered flooding in southern China's Guangxi region and Guangdong province, forcing relocations and disrupting transport. On June 18, powerful waves flooded a seaside shop on Weizhou Island. Rescuers are searching for survivors, and scientists warn that catastrophic storms will test China's resilience in 2026.
