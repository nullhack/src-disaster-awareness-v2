summary: Qatar sent a fully equipped field hospital to Colombia to support earthquake victims, while US Secretary of State Marco Rubio announced a regional tour that will include discussions on earthquake response. Financial firm PU Prime delivered essential supplies to 34 families in Chocó, and the Primate of Colombia urged a focus on rebuilding the people before churches.
