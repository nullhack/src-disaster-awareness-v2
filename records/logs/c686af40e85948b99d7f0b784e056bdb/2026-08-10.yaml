summary: A magnitude 7.4 earthquake struck western Colombia on August 10, 2026, with its epicenter near San José del Palmar in Chocó province. The quake caused injuries and significant damage in Chocó and the city of Pereira, prompting evacuations across Colombia and in neighboring Ecuador, with tremors felt as far as Panama and Venezuela.
