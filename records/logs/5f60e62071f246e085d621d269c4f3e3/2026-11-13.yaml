summary: A powerful nor'easter brought severe weather to the Northeast on Thursday, spawning confirmed tornadoes in Delaware and the Philadelphia region and prompting tornado watches in New Jersey. Heavy rain and snow impacted travel, and severe weather forced spectators inside at MetLife Stadium for a Thursday Night Football game. Meanwhile, downpours are expected to drench parts of Texas over the weekend.
