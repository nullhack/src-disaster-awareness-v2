summary: |-
  Five people were injured when JetBlue Flight 1717 from Puerto Rico encountered severe turbulence while heading to Fort Lauderdale, and thunderstorms may have been a factor. Other selected reports concern severe weather in India, South Africa, California, and Asia rather than this incident.
  Heavy rainfall and flooding prompted Broward County Public Schools to close all schools, offices, and care programs in South Florida. Jacksonville was placed under a flood watch through Friday with 4 to 8 inches of rain forecast, while rain continued in Brevard County and raised flood concerns. A separate Northern California storm resources page was also included but concerned a different event.
