summary: Heavy rain and flooding shifted north along Florida’s Atlantic coast, prompting flood rescues, road closures, and states of emergency in parts of Volusia and Flagler counties. The St. Johns River reached a record flood level, and forecasters warned that a developing storm system could bring more tropical rain, wind, and coastal flooding northward while threatening early Thanksgiving travel. A separate set of reports concerned Cyclone Akvan in India and was not related to this incident.
