summary: Iran targeted U.S. drone and missile sites at a Kuwait air base and sites in Bahrain, widening Gulf attacks after an American strike on an Iranian island. The U.S. military returned to two aircraft carriers supporting Iran operations in the Middle East, while the IEA said the war has caused the largest disruption ever to global oil and gas trade and could cut world oil demand by more than 4% by 2035 through accelerated electrification. Separately, President Trump grew frustrated with Vice President Vance over his Iran war critique, and the acting counterterrorism chief said Iran’s leadership has not moderated, undercutting hopes for a diplomatic reset.
