summary: |-
  Iran attacked a US radar site in Bahrain using six drones, prompting Bahrain to issue its first public threat alerts since September. President Trump signaled a shift away from both new military strikes and further talks, declaring the US does not need a deal, though experts caution his strategy remains unclear. The conflict also continues to drive oil price volatility and is accelerating Southeast Asia’s shift to renewable energy due to persistent fuel disruptions.
  Iran launched a drone attack on a US military base in Bahrain, prompting condemnations from Saudi Arabia, Qatar, Jordan, and Egypt, while also indicating it remains open to a deal with the US. The IEA reported that global oil shipments have rebounded to surplus for the first time since the war began, and Iran stated it will seek reparations from regional countries. Yemen's army repositioned troops away from the Bab al-Mandeb Strait amid the continuing tensions.
