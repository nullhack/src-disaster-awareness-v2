summary: Iran massed more than 14 tankers at its most important crude export terminal and released footage of a new underground missile launcher, while an Iranian attack set a civilian industrial facility in Bahrain on fire and Tehran claimed it targeted US military positions there. Two tankers were reported on fire near the Strait of Hormuz after hitting mines, a tanker incident involving military forces was reported, and the UAE and Oman continued searching for a Jordanian sailor missing after a Hormuz tanker attack. The Houthis claimed strikes on a Saudi oil refinery and port, and Israeli military intelligence reportedly warned Netanyahu that an Israeli attack on Iran could spark a multifront war.
