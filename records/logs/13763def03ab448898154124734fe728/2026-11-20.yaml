summary: Renewed U.S.-Iran exchanges of fire ended a roughly two-month lull, with Iran targeting drone and missile sites at bases in Kuwait and Bahrain and a U.S. fighter jet striking a missile launch site on Iran's Qeshm Island. The Senate again rejected a resolution directing President Trump to end the war or seek congressional authorization, 48–51, with three Republicans joining Democrats, while the IRGC declared Iran International a military target and the Mossad chief reportedly pressed Washington for renewed U.S.-Israeli strikes. A symbolic Trump-Xi-Putin "peace declaration" omitted the Iran war entirely, a GAO watchdog found the Pentagon has no department-wide plan to fix munitions shortfalls, and crude and gasoline prices edged higher on escalation fears.
