summary: Iran reiterated that it will not hold talks with Washington until its seven conditions are met, as Vice President Vance and Secretary of State Rubio met Qatar's prime minister amid mounting uncertainty over President Trump's intentions; Trump separately told the New York Post that the war effort is "funded" through January and addressed Israel's stated goal of regime change in Tehran. In Washington, Senate negotiators scrambled for a fragile spending deal tied to Iran, raising the odds of a government shutdown, while the Saudi-led coalition struck Yemen's Hodeidah port and Houthi forces closed in on Aden. Iran also accused the U.S. of using AI to select targets in the war and urged UN regulation.
