summary: Reports indicate the Trump administration is weighing strikes on Iran’s senior leaders in a bid to end the war, while Iran’s deputy parliament speaker threatened to block other regional oil exports to break the U.S. blockade. Iran said three oil tankers hit naval mines in the Strait of Hormuz despite a U.S. naval escort, with shipping attacks reported at an all-time high as the Treasury widened sanctions. The war added $3.1 billion to Thanksgiving fuel costs, with American households already paying $1,068 extra, while Houthi rebels advanced close to Aden.
