summary: |-
  Reports indicate the Trump administration is weighing strikes on Iran’s senior leaders in a bid to end the war, while Iran’s deputy parliament speaker threatened to block other regional oil exports to break the U.S. blockade. Iran said three oil tankers hit naval mines in the Strait of Hormuz despite a U.S. naval escort, with shipping attacks reported at an all-time high as the Treasury widened sanctions. The war added $3.1 billion to Thanksgiving fuel costs, with American households already paying $1,068 extra, while Houthi rebels advanced close to Aden.
  Kuwait said an Iranian drone attack killed two Italian nationals, and Iran's foreign minister rejected the claim in a call with his Kuwaiti counterpart, denying Tehran was behind the strike. The rest of the batch largely repeated already-reported events — Iranian fire on Bahrain, oil rising on Iran's claimed mine strikes on ships, and Houthi advances near Aden — alongside commentary on how the war has been shaped by AI-driven decision-making.
