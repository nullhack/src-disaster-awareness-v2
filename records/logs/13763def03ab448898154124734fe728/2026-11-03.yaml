summary: |-
  The U.S. struck Iran's Qeshm Island despite ongoing diplomatic contacts, with President Trump simultaneously claiming oil prices are falling and that Iran wants a settlement. Vice President Vance expressed measured optimism about reaching a deal, while Secretary of State Rubio confirmed Trump favors a diplomatic exit over further military escalation. Reports also indicate that Iran has offered to reopen the Strait of Hormuz under conditions, and discussions of potential strikes on Iran's "Pickaxe Mountain" nuclear site continue.
  President Trump is facing mounting criticism for his apparent ignorance of U.S. fatalities and war costs, while Iran’s chief negotiator stated that the United States must act to prevent renewed hostilities. Tucker Carlson warned that Trump could be days from a nuclear decision, and economic spillovers continued with Lufthansa announcing ticket‑price increases and the Asian Cup being postponed due to the conflict. Oil markets are closely watching ceasefire talks in Doha and Washington for signs of progress.
