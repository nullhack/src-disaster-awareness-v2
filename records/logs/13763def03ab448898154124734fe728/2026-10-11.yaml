summary: |-
  A Houthi missile strike on Riyadh's airport killed 12 people, including an American, prompting President Trump to signal possible U.S. intervention in Yemen. The U.S. military disabled a cargo vessel attempting to run the blockade of Iran, and the Kremlin announced that Putin relayed Iran's peace position to Trump. New reports also indicate Iran retains its missile production capability despite ongoing U.S. strikes.
  Iran dismissed the U.S. response to its conditions for reopening the Strait of Hormuz as insufficient. Houthi rebels struck the passenger terminal at Riyadh’s airport for a second consecutive day and also targeted Sanaa airport. Meanwhile, 74 House Democrats demanded the Pentagon provide answers regarding U.S. strikes that killed civilians in Iran, including a wedding attack.
