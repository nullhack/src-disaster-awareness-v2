summary: The USS Theodore Roosevelt arrived in the Middle East as a third U.S. aircraft carrier while Iran escalated threats and a tanker was struck in the Strait of Hormuz. Bahrain was rattled by a second Iranian drone attack, and U.S. intelligence reports said Iran was developing plans to detonate a dirty bomb in Washington and target senior Trump administration officials. Political fallout continued as a whistleblower alleged the Pentagon ignored warnings before a Kuwait drone attack killed six U.S. service members, Trump attacked CBS over its report, and JD Vance promised the war would not become a “forever war” and would end by 2028.
