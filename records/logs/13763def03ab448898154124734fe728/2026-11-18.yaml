summary: A U.S. fighter jet used precision munitions to strike a missile launch site on Iran's Qeshm Island, while Iran said its army targeted U.S. drone and missile installations at Kuwait's Ali Al Salem air base, extending its run of attacks on Gulf states. At his confirmation hearing, acting Navy chief Hung Cao was pressed by lawmakers over the strain the war has placed on maritime forces, opaque leadership shake-ups and low crew morale. Separately, Rep. Ro Khanna proposed $1,700 refund checks for every U.S. family to offset the war's economic impact, and Iran claimed Israel was behind reports of a dirty-bomb threat in Washington.
