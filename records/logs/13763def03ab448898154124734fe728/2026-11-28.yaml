summary: |-
  U.S. forces disabled a Palau-flagged commercial vessel with precision munitions after it allegedly tried to run the naval blockade of Iranian ports, while a USA Today report disclosed that the U.S. naval base in Bahrain suffered damage likely to cost more than $400 million, largely unacknowledged by the Trump administration. Iran's navy chief warned of coming operations and claimed the U.S. Fifth Fleet has been crippled, and new satellite imagery showed a mystery site near Pickaxe Mountain as President Trump issued a fresh threat against Iran. Separately, Trump's remark to a service member about when the war will end sparked backlash, Houthi rebels advanced close to Aden, and reporting highlighted soaring respiratory hospital admissions among Iranians amid winter pollution.
  Centcom denied a claim by Iran's navy chief that Iranian forces struck the USS Abraham Lincoln on the first day of the war, amid continued sparring over events in the Strait of Hormuz. Iran's ambassador to Pakistan said Tehran and Washington are exchanging messages through Qatar and Pakistan, even as Iran's army chief insisted the Strait of Hormuz will not reopen until Iran's conditions are met and a senior adviser to the supreme leader warned Iraq against becoming a "tool" of US pressure over border controls. Separately, political scientist Robert Pape warned that the risk of a major military escalation is rising.
