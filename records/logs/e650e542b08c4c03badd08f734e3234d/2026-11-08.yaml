summary: |-
  Trump appointed Stephen Miller, a strong Israel supporter and Iran hawk, as his new chief of staff. Gadi Eisenkot, the former Israeli army chief, emerged as the frontrunner to replace Prime Minister Netanyahu, potentially with support from Arab parties. A UN investigator called for Netanyahu to answer before the ICC, while AIPAC-backed candidates saw mixed results in the US midterm elections.
  Gadi Eisenkot, Netanyahu's top rival, has been formally tasked with forming a new Israeli government, a development that could reshape the political landscape. Separately, an Arab journalist was released from police detention, and protests over the conflict continued in the US alongside a tribute in Australia to Gaza's children.
