summary: Israeli tanks advanced beyond the "Yellow Line" in Gaza, forcing Palestinians to flee again, while a top Hamas commander who helped plot the October 7 attacks was assassinated in a Gaza strike. Separately, Israel's army beat a journalist covering a settler attack near Jericho, as the Knesset elected a new speaker amid chaotic scenes. An investigative report also detailed how Deutsche Bank financed gearboxes for Israel's Merkava 4 tanks, and an opinion column urged Ireland's EU Presidency to act against impunity rather than merely talk.
