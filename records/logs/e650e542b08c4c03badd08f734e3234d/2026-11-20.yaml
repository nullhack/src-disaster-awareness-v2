summary: Palestinians in Gaza faced new displacement after an Israeli army operation, with families in Nuseirat spending the night without shelter and many fearing to return despite the offensive being declared over. Saudi Arabia and other Arab and Islamic foreign ministers welcomed new UK and Australian sanctions over Israeli settlements. Separately, Palestinian children in Gaza took part in swimming lessons along the coast as relief from the war's psychological toll, while former US National Security Adviser Jake Sullivan was confronted by student protesters at MIT.
