summary: An Israeli strike in Gaza City killed three people in a vehicle containing World Central Kitchen-branded papers, with Israel and World Central Kitchen giving conflicting accounts over whether it was carrying aid or militants. Oxfam reported that contamination sources affect more than 99% of Gaza, creating a “toxic wasteland” that threatens Palestinian health for generations. In the occupied West Bank, settlers’ movement into a Palestinian neighborhood near Jericho was linked to deadly violence, including the killing of a 72-year-old woman.
