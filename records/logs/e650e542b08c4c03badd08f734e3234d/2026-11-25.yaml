summary: Palestinian families in Gaza are waiting for relatives who remain in Israeli prisons even after completing their sentences, according to reporting on prisoners held behind Israeli bars. Separately, Israeli police confiscated mosque loudspeakers as far-right lawmakers pushed legislation to restrict the call to prayer, with Ben-Gvir accused of seeking a "religious war." Iran also ruled out talks with the U.S. until seven conditions, including an end to sanctions and blockades, are met, citing regional clashes and Gaza casualties.
