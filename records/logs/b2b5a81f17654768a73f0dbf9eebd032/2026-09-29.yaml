summary: Hurricane Polo made landfall in Baja California Sur as a Category 2 hurricane late Monday, bringing damaging winds, flash flooding, and storm surge that flooded coastal communities and toppled trees. The storm is now tracking toward mainland Mexico and is expected to draw deep tropical moisture into the southwestern United States, raising flood risks.
