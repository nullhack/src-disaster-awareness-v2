summary: As of September 18, heavy rainfall continues to cause flooding in multiple areas of Metro Manila. The DPWH has initiated a drainage widening project in Marikina City to mitigate future floods. Meanwhile, the European Union has provided €150,000 in humanitarian assistance to support victims in Luzon.
