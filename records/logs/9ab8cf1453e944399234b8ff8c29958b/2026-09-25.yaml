summary: Flooding in Lam Dong Province forced evacuations as heavy rain and reservoir discharges inundated residential areas. In Dong Nai City, a woman drowned and 286 households were affected. Torrential rain continued in the central region on September 25 with localised falls above 150 mm forecast from Nghe An to Quang Tri.
