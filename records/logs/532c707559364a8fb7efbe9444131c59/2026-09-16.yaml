summary: New reports confirm that Fuego volcano’s early-August eruption produced lava fountains up to a thousand feet high and prompted the evacuation of two villages as it shifted toward a more explosive phase. Authorities continued to note gradually decreasing activity, but persistent ash and mudflow risks kept around 1,700 people sheltered. No major new developments beyond these details were reported.
