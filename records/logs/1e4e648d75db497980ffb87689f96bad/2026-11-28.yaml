summary: A magnitude 6.7 earthquake struck Russia’s Kamchatka Peninsula near Yelizovo on November 28, with the epicenter reported about 62 km NNW of Yelizovo. Sources reported the quake occurred at a depth of roughly 188–205 km, and there was no tsunami warning, with low damage risk noted due to the depth.
