summary: As of August 19, about 22,000 customers in Gary, Indiana, remain without power from the Aug 11 storms, with restoration expected to take up to two weeks. A flood watch has been issued for central Ohio as heavy rain returns, and a nonprofit in Millersport, Ohio, is providing rest and support to flood victims.
