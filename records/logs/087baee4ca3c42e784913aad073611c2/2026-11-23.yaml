summary: A magnitude 6.8 earthquake struck deep beneath the Timor/Banda Sea region on Saturday, Nov. 21, with USGS listing the reviewed depth at 132.1 km. Shaking was felt in Dili and hundreds of miles away in Darwin, Australia, according to reports. Australia's Bureau of Meteorology reported no tsunami watches or warnings, and no casualties or damage were reported.
