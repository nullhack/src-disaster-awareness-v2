summary: France’s main sugar groups, Tereos and Cristal Union, offered financial support to beet growers affected by drought and heatwaves in an effort to secure plantings for the 2027 crop. New York added 13 counties to its drought watch as forecasts signaled little relief, and a Thanksgiving drought monitor update noted that rain continues.
