summary: |-
  Powerful storms are expected to bring heavy mountain snow and possible flooding to western drought-affected regions this week. Colorado Springs is looking to a snowy winter to help replenish water reserves after avoiding drought restrictions despite widespread drought across Colorado. In Tennessee, damage from recent drought and extreme heat is showing up widely, including trees killed by unusually hot, dry fall weather.
  Maharashtra ordered drought assessments across every district and declared four additional talukas drought-hit, while approving Rs 83.18 crore for 212 water supply schemes and Rs 400 crore for retrofitting. Drought expanded in central Illinois as rainfall deficits deepened, and Jackson, Mississippi’s water utility reported that drought is leading to more water main breaks. In Karnataka, Krishi Mela highlighted three new resilient crop varieties amid drought concerns, and a stolen car from 2010 was recovered from the Big Black River in Hinds County after drought lowered water levels.
