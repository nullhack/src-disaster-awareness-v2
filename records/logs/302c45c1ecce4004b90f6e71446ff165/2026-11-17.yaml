summary: Powerful storms are expected to bring heavy mountain snow and possible flooding to western drought-affected regions this week. Colorado Springs is looking to a snowy winter to help replenish water reserves after avoiding drought restrictions despite widespread drought across Colorado. In Tennessee, damage from recent drought and extreme heat is showing up widely, including trees killed by unusually hot, dry fall weather.
