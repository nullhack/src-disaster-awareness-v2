summary: Drought has exposed remnants of communities dating to the 1700s beneath North Carolina’s Jordan Lake, while Christmas tree farms there report strong demand despite months of dry conditions and rising costs. Emergency water restrictions began in Bath County, and Campton, Kentucky declared a state of emergency because its lone water supply is critically low. Elsewhere, Caribbean officials urged preparation for El Niño’s impact on the upcoming dry season, Europe’s desertification risk was highlighted, and Pacific droughts were cited amid global economic concerns.
