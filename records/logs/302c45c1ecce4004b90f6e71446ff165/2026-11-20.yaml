summary: North Carolina’s latest drought report shows more than half the state’s population—about 6.2 million people—living in drought-affected areas, with nearly 40 counties in extreme drought and Triangle reservoirs continuing to drop as officials urge water conservation. In North Dakota, Governor Kelly Armstrong ended the statewide drought disaster declaration, citing improved soil moisture, though severe and extreme drought remains in parts of the state.
