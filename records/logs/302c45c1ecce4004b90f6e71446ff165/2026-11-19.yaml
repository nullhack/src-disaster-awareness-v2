summary: Fiji declared a national state of disaster and Tonga declared a state of emergency due to El Niño-driven drought and severe water shortages. In the U.S., a Colorado wildlife center treated a record 47 orphaned bear cubs amid drought-related malnutrition, Lake Powell dropped dangerously close to a critical hydropower threshold, and North Carolina experts said winter precipitation from a potentially record-strong El Niño is the state’s best chance to break the drought. South West Water said tap-water rationing remains a last-resort drought contingency not expected this winter.
