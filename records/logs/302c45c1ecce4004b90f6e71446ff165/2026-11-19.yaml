summary: |-
  Fiji declared a national state of disaster and Tonga declared a state of emergency due to El Niño-driven drought and severe water shortages. In the U.S., a Colorado wildlife center treated a record 47 orphaned bear cubs amid drought-related malnutrition, Lake Powell dropped dangerously close to a critical hydropower threshold, and North Carolina experts said winter precipitation from a potentially record-strong El Niño is the state’s best chance to break the drought. South West Water said tap-water rationing remains a last-resort drought contingency not expected this winter.
  Maharashtra added six talukas to its drought-hit list, raising the total to 310, while Karnataka said the central government had not yet responded to three memorandums seeking drought aid. North Carolina’s drought worsened, with 26% of the state under extreme conditions and 39 counties in extreme drought, prompting conservation appeals; meanwhile, a very strong El Niño is putting Brazil’s 2026–27 wheat and corn harvests at risk. Other reports noted Telangana activists seeking to postpone a global summit and a stolen car recovered from the drought-shrunk Big Black River in Mississippi.
