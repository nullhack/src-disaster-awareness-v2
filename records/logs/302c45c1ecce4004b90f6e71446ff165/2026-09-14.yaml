summary: The latest U.S. Drought Monitor shows drought improvement in parts of Minnesota and northwestern Iowa due to recent rainfall. In Sri Lanka, tourists have been barred from the drought-hit Yala National Park as El Niño looms. Forecasts indicate a "very strong" El Niño expected to take effect, potentially becoming the strongest on record and influencing global drought patterns.
