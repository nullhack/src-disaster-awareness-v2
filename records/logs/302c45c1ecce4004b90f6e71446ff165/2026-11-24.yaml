summary: Drought losses prompted Catanauan, Quezon to declare a state of calamity after P147 million in damages, while Isabela declared a state of calamity following P2.881 billion in crop losses, mostly corn and palay. Maharashtra’s agriculture department expects sharp declines in kharif pulses, oilseeds, and foodgrain due to drought, as Pacific governments stepped up their El Niño response and Zimbabwe set aside US$400 million for a predicted drought. In Mississippi, lingering extreme drought extended Hinds County’s burn ban, and a cattle farmer reported that drought kept ryegrass from growing, forcing early hay feeding.
