summary: Fakenham's Sunday meeting was cancelled as freezing temperatures combined with the summer's drought to hamper racecourses, while the UK is digging new reservoirs to address persistent droughts that still leave parts of the country drought-stricken despite the return of rain. Fiji's FCOSS warned reduced crop production could push up prices for root crops and vegetables, and JPMorgan cautioned that the long tail of El Niño, worsened by climate change, will keep hurting crops and water supplies into 2027. The UN Secretary-General also warned that landslides and drought threaten the centuries-old Banaue rice terraces and surrounding communities in the Philippine Cordilleras.
