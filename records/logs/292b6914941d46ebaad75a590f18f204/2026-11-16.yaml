summary: New coverage focuses on how the quake is being depicted online, with AFP fact-checkers debunking a video of a collapsing building from a Colombia earthquake that social media users falsely attributed to the Peru tremor. Other reports place the epicenter roughly 35 km north of Coracora at a depth of about 108 km and reference aftershocks, while a KESQ piece describes Peruvian families in California's Coachella Valley checking on relatives who said the quake did not cause widespread damage.
