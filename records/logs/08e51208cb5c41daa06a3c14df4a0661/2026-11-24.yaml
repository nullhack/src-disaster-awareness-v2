summary: The USDA has temporarily banned imports of ruminant semen, embryos, and cloning tissue from the EU and U.K. until testing capacity improves, citing the spread of Shamonda virus. Reports also describe an emerging virus historically found in cattle being detected in horses with neurological disease in Europe, and an unidentified virus causing fever, diarrhea, and reduced milk production in Breton livestock.
