summary: According to reports, a 5.9-magnitude earthquake struck Balochistan's Khuzdar district on October 17, 2026, causing one death when a falling rock struck a man in the Naal area. The earthquake also damaged several traditional mud houses. The epicenter was located 48 kilometers northwest of Khuzdar at a depth of 25 kilometers.
