summary: A magnitude 6.6 earthquake struck off Tual, Indonesia, in the Banda Sea, with USGS reporting it about 148 kilometers west-southwest of Tual at a depth of 68 kilometers after earlier preliminary reports of magnitude 7.1. Authorities reported no tsunami threat and no immediate casualties or structural damage, while tremors were felt in parts of eastern Indonesia and as far as Darwin, Australia.
