summary: Afghanistan's severe drought is pushing millions deeper into crisis, with residents of Bamyan province — one of the country's poorest regions — lacking access to safe drinking water amid widespread poverty. New Brunswick's Western Valley reported average or above-average potato crops in 2026 following the 2025 drought, while Greece is designing an alternative route for Ukrainian grain exports as attacks on Black Sea ports and Danube drought disrupt shipments. Separately, new research indicates solar-induced chlorophyll fluorescence can be unreliable as an early indicator of drought stress in Ginkgo biloba.
