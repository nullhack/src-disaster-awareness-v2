summary: |-
  Afghanistan's severe drought is pushing millions deeper into crisis, with residents of Bamyan province — one of the country's poorest regions — lacking access to safe drinking water amid widespread poverty. New Brunswick's Western Valley reported average or above-average potato crops in 2026 following the 2025 drought, while Greece is designing an alternative route for Ukrainian grain exports as attacks on Black Sea ports and Danube drought disrupt shipments. Separately, new research indicates solar-induced chlorophyll fluorescence can be unreliable as an early indicator of drought stress in Ginkgo biloba.
  South African farmers are navigating El Niño uncertainty with early plantings and crop shifts as heatwaves and drought challenge the summer crop outlook. In Ethiopia, failed rains pushed maize prices to record highs, with IFPRI projecting 905,000 more Ethiopians falling into poverty in 2027. BMI warns that El Niño-driven water shortages could delay Southeast Asia's data center expansion, while new Utah State University research ties a warm, snow-poor winter to warning signs of more frequent future droughts.
