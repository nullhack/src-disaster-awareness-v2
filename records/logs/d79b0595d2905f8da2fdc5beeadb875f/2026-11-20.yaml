summary: More than half of Arkansas is in exceptional drought, with the entire state experiencing some level of drought. Climatologists expect a powerful El Niño to bring warmer, drier weather to the already drought-affected Central Plains into spring. Heavy fall rains raised Lake Powell about 20 feet and federal forecasts show it staying above critical levels next year, though winter snow will ultimately determine its outlook.
