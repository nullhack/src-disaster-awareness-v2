summary: Western Cape agriculture is facing a 15% reduction in water allocations, with Agri Western Cape warning of consequences for production, exports and rural employment. The UK is digging new reservoirs to counter persistent droughts, Quebec's prolonged drought has increased its reliance on New York's grid, and Gainesville, Florida is reckoning with spring wildfires as drought conditions near a full year. Meanwhile, dry El Niño conditions boosted basmati yields by 12.2% in Haryana and Punjab even as other Indian crops suffered.
