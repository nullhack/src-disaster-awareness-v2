summary: A fire broke out during the demolition of an earthquake-damaged chimney at the Nippon Paper plant in Kumamoto, where the chimney's collapse in the July 28 quake had previously left nine people dead. Meanwhile, some quake-hit areas in Kumamoto are reporting uneven media coverage, which has affected the distribution of disaster relief volunteers and donations.
