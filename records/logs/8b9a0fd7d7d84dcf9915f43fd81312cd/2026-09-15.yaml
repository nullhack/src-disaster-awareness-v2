summary: Mitsubishi Electric announced a cumulative donation of 44.16 million yen through its in-house matching-gift program to support those affected by the Kumamoto earthquake. Additionally, Kumamoto Prefecture will launch a travel discount campaign this week to boost tourism demand following the disaster, as announced by Governor Takashi Kimura.
