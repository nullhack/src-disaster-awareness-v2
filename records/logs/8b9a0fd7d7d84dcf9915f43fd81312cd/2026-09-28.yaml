summary: Two months after the Kumamoto earthquake, over 1,500 people remain in evacuation centers, though some evacuees have begun moving into temporary housing; building assessments and well restoration are still incomplete. Separately, a man in Yatsushiro was arrested for assaulting an insurance company employee who was visiting his quake-damaged home to conduct an insurance assessment.
