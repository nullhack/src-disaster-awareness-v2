summary: The Kyushu Shinkansen resumed full service on Friday, September 18, restoring all sections between Hakata and Kumamoto 52 days after the July earthquake halted operations. Additionally, Taiwan's donation of approximately US$9.5 million for Kumamoto relief efforts was reported, confirming the previously announced fundraising total.
