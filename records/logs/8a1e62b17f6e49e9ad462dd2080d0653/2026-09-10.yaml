summary: In the first week of September 2026, severe weather continued to cause damage across multiple states. A person went missing near Table Rock Lake in the Ozarks after severe thunderstorms downed trees, and homes were damaged by fallen trees in Tennessee. Strong winds also knocked out power to thousands in the Kansas City metro area.
