summary: New severe weather over the weekend of September 19-20 forced evacuations at the Lost Lands Music Festival in Ohio and the Shaky Knees Festival in Georgia, and caused downed trees and damage in the Chattahoochee Valley and Columbus, Georgia areas. Additional severe thunderstorm warnings and flood watches were issued across multiple states.
