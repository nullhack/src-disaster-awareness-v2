summary: The National Weather Service confirmed three additional tornadoes from the Aug. 11 derecho in central Ohio, including two in Franklin County, raising the total tornado count in Ohio from that event. In response, Franklin County Auditor noted that homes damaged by the weeks of severe weather may qualify for a property tax reduction under state law.
