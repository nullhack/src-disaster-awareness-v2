summary: A multidrug-resistant strain of Klebsiella pneumoniae was detected in an 86-year-old woman with a urinary infection admitted to a hospital in Northeast Brazil in 2022. The strain proved resistant to all available antibiotics, highlighting the ongoing global challenge of antimicrobial resistance in hypervirulent K. pneumoniae.
