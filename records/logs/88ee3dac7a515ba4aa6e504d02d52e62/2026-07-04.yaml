summary: A new variant of monkeypox virus, clade Ib, emerged in Kamituga, Democratic Republic of the Congo, in 2023 and has since been associated with community and healthcare-associated transmission in DRC and Europe. This variant has led to broader transmission of mpox beyond previously affected regions, highlighting ongoing global health concerns.
