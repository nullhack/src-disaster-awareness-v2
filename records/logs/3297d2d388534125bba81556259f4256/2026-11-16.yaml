summary: A report warns that drought and conflict are threatening Emergency-level food insecurity in Tigray, while projecting some seasonal improvements in parts of southern and southeastern Ethiopia. Separately, experts urged West African governments to prepare for delayed rainfall, prolonged dry spells, and rising temperatures that could threaten harvests, water supplies, and public health in 2026–2027. A GDACS event summary provides only general disaster-awareness context without incident-specific details.
