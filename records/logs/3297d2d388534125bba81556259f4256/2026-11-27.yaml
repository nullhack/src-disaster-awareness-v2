summary: Tonga's government is facing scrutiny after heavy rain in Vavaʻu followed its nationwide drought emergency declaration, while in India Maharashtra identified five districts as flash-drought hotspots and Telangana's Vikarabad district imposed restrictions on borewell drilling amid its deepest October groundwater levels on record. In the United States, prolonged drought left more than 6.2 million North Carolinians in affected areas as reservoirs dropped, pushed cattle producers to sell livestock, and cost a long-running Christmas tree farm its entire season, even as southern Colorado's conditions improved sharply at the cost of flooding and North Dakota's governor rescinded two drought disaster orders.
