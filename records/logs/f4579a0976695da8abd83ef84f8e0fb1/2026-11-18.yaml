summary: Hillsborough County, Florida, saw its dengue case count climb from 385 to 407, the highest total in the state, as scientists work to prevent the virus from becoming endemic there. In Delhi, dengue cases fell from 90 to 61 this month as colder weather set in. Researchers at the University of Maryland School of Medicine and the Institute of Human Virology announced the first successful human challenge model for dengue serotype 4, which could accelerate vaccine and drug testing. In Bangladesh, one more dengue death raised the 2026 toll to 508, with total confirmed cases reaching 167,318.
