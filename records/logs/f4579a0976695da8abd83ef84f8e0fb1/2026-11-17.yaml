summary: Florida reported 100 additional locally acquired dengue cases in a single week, raising its 2026 total to 624, with Hillsborough, Pinellas and Pasco counties accounting for 92 of the new infections even as the number of cases under health department review declined. A separate epidemiological study of national surveillance data documented 13,371 dengue cases and 21 deaths across 10 states in Sudan between August 2024 and July 2025 amid the country's ongoing conflict.
