summary: Bangladesh's dengue death toll rose to 520 for the year, with 1,519 new patients admitted to hospitals nationwide in a 24-hour period, according to health authorities. An editorial put the toll at 518 confirmed deaths at the time of writing, with hospitalizations for the year approaching 175,000 and warned that the country is losing the fight against the disease.
