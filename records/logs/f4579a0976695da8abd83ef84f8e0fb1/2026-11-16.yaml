summary: Bangladesh's dengue death toll crossed 500 this year, reaching 502 after three more deaths were reported, following an earlier single-day report of eight deaths and 1,952 new hospitalizations. In the latest 24-hour span, 1,598 more patients were hospitalized, bringing the 2026 total caseload to 164,107. For comparison, the country recorded 101,214 dengue infections and 575 deaths in 2024.
