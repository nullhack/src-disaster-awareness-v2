summary: Central Visayas recorded nearly twice as many dengue cases in less than 11 months of 2026 as it did throughout the previous year, and Nepal’s Kavre district confirmed 54 infections from the start of the current fiscal year through early Mangsir. Bangladesh reported four additional dengue deaths in 24 hours, raising the 2026 toll to 524, with 1,145 new hospitalizations, while a Dhivehi-language report highlighted parental doubts about the dengue vaccine.
