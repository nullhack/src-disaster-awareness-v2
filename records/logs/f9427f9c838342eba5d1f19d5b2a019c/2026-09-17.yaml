summary: A large wildfire on Croatia's Brač Island forced the evacuation of tourists, including dozens of Britons who fled into the sea to escape the flames. Around 700 people were evacuated by boat, and some swam to safety, with the fire being described as highly dangerous and unpredictable. The incident prompted travel advice updates for the region.
