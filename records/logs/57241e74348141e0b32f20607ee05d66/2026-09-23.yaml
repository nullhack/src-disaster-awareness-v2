summary: As of September 19, 2026, forecasts indicate continued severe storm risks across the Midwest and Plains, including weekend threats in Oklahoma and scattered storms in Indiana, Kansas, and Nebraska. Utility companies in New Mexico are encouraging residents to prepare for potential power outages due to impending severe weather. Heat relief is expected to arrive on Sunday for some areas that have been experiencing high temperatures.
