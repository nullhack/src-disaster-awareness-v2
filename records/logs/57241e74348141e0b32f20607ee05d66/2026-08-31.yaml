summary: Severe storms continue across the US, with a heat dome bringing storms and flooding to the Northeast and monsoon activity triggering flash flood warnings in Arizona. Flash flooding in Grand Canyon National Park resulted in at least one death and over a dozen missing. Additional severe thunderstorm threats and a ground stop at Denver International Airport were reported.
