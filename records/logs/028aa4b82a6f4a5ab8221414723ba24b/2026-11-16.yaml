summary: Two wildfires — the growing Timber Fire and the newly established Plaskett Fire — are burning in Big Sur, prompting evacuation orders and closures along Highway 1, including a 40-mile stretch, as businesses shut down. Firefighting conditions are worsening under a Red Flag Warning, with reports describing massive fires forcing new shutdowns and evacuations in the area.
