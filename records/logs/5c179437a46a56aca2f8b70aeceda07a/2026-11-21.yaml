summary: Uganda suspended concerts, festivals, rallies, and other mass gatherings in high-risk border districts as part of stepped-up measures to prevent Ebola importation from the Democratic Republic of Congo. Uganda and South Sudan intensified efforts to keep the virus out, while the head of a global vaccine organization said clinical trials of three Bundibugyo Ebola vaccines could lead to a breakthrough early in 2027. In Bunia, an Ebola survivor urged relatives to follow precautions after 46 members of his family died, and large-scale vaccine trials were launched in the outbreak’s epicenter amid security concerns.
