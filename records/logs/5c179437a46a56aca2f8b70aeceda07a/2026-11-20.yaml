summary: Scientists are learning more about the rare Bundibugyo Ebola virus behind the Congo outbreak, which has produced more than 11,000 cases and over 5,500 deaths while spreading at double its usual pace. In conflict-affected areas, religious leaders are stepping in to bridge healthcare gaps where health workers struggle to reach communities. Commentary marking six months since the international emergency declaration frames the epidemic as intertwined with war, hunger, and profit.
