summary: WHO officials reported encouraging progress in containing the DRC Ebola outbreak, describing signs of improvement in some areas, but warned the epidemic remains far from over with cases surging in North Kivu. Separately, new analysis from WHO, Africa CDC, and US researchers suggests the virus may have circulated in Congo for months before the outbreak was officially declared, potentially explaining its rapid spread.
