summary: ECDC data reported by Rio Times put the DR Congo outbreak at 11,376 confirmed cases as of November 15, while a Reuters video reported the UN appealing for international support as Ebola deaths in the DRC reached about 5,500. WHO is expanding the Tumaini trial by adding two Bundibugyo vaccine candidates, ChAdOx1 and mRNA-1469, according to CASRAI. The New York Times reported that patients in eastern Congo are avoiding hospitals and spreading the virus at home, and Rio Times noted Guinea-Bissau had found no Ebola cases as of November 18.
