summary: The UAE has allocated $10 million to support Ebola containment efforts and lifted travel restrictions for Uganda, which was earlier declared Ebola‑free. North Kivu province has emerged as a new hotspot, with treatment centre beds completely full, while a shortage of health workers continues to strain care in affected areas.
