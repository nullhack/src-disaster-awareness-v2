summary: WHO chief Tedros Adhanom Ghebreyesus pleaded for peace in Ebola-hit eastern DR Congo, stating that the frequency of attacks across the country's east has increased since the end of October and that heavy fighting near a hospital in Ituri Province has disrupted containment and endangered patients and health workers. Separately, Africa's top health official urged the UK and its allies to do more to tackle the rapidly spreading virus, warning that global spread of the deadly Ebola strain with no cure remains possible.
