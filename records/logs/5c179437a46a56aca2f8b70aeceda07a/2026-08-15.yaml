summary: The United Nations has reported that the Ebola virus in DR Congo is now killing a person every 30 minutes, marking a rapid escalation in the outbreak’s deadliness. Health workers are increasingly overwhelmed, with contact tracing failing to keep pace amid ongoing strikes and logistical challenges. The outbreak, already the fastest-spreading on record, continues to pose a severe threat.
