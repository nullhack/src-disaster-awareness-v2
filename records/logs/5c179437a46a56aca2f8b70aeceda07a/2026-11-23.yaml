summary: New reports put the DRC Ebola outbreak at roughly 11,645–11,680 confirmed cases, with deaths near or above 5,700; one report says 500 cases and 246 deaths were added in a week. WHO warned that escalating fighting in eastern DRC, including near hospitals and in Ituri, is disrupting Ebola response efforts and that staff were trapped in a maternity ward, prompting calls for peace and safe evacuation.
