summary: Government data showed on November 26 that confirmed Ebola cases in the Democratic Republic of Congo have exceeded 12,000, as responders continue to struggle to contain the outbreak. Gavi, the Vaccine Alliance, secured access to up to 1.5 million doses of an experimental Ebola vaccine amid rising deaths, while the CDC extended its Ebola entry-ban authority over green-card holders for six months without a public comment period. Escalating fighting in eastern Congo forced Ebola workers to evacuate and blocked roads needed to reach patients, threatening the response.
