summary: Six months into the DR Congo Ebola outbreak, reports put the toll at more than 11,000 confirmed cases and 5,505 deaths, with nearly half of infected people dying. Africa CDC said the outbreak is still not under control and warned it could become the worst Ebola outbreak if not stopped, while WHO cited violence, poor healthcare access, and funding shortages as barriers, especially in rural communities. UNICEF reported that children accounted for 35% of deaths through Nov. 4, and Bloomberg described containment as increasingly dependent on addressing hunger, armed conflict, mistrust, and a buckling health system.
