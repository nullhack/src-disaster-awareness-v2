summary: The World Health Organization has confirmed 81 attacks on health facilities during the DR Congo Ebola outbreak, with over 1,000 contacts lost to violence that has hampered containment. In a separate analysis, the Time magazine emphasizes that cuts to international assistance, including the gutting of USAID, along with inadequate healthcare infrastructure and conflict, are severely undermining efforts to control the epidemic.
