summary: Confirmed Ebola cases in DR Congo have risen to 8,750, according to Africa CDC. A suspected case in Kenya tested negative, and the country has set up a task force to manage the response, with the WHO advising against travel restrictions. Additionally, the Norwegian Refugee Council warns that hundreds of thousands of children are facing education disruption due to the outbreak.
