summary: Uganda announced stricter Ebola measures, threatening to sanction airlines and banning the movement of learners from the DRC, while suspending concerts and rallies in high-risk border districts with police enforcing health clearances. The DRC's mining sector contributed $1.1 million to the response as confirmed Bundibugyo cases passed 11,000, and the WHO said two strain-specific vaccines will begin trials in the outbreak's epicenter next week. Nigeria and Kenya have completed contact follow-up and entered the 42-day surveillance period, while commentary warned the response cannot succeed without a broader humanitarian effort.
