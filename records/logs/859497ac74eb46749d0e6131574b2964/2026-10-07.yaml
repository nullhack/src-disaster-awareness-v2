summary: Tropical Depression Nine formed in the Gulf of Mexico, expected to strengthen into a hurricane and impact the Gulf Coast, leading Florida to declare a state of emergency in 25 counties and communities in Alabama to prepare. San Diego confirmed a local emergency ahead of a heavy El Niño season, while Spanish authorities issued orange alerts for torrential rain across the Catalunya coastline.
