summary: Multiple reports describe a strong earthquake in the Indian Ocean near Mauritius on 24 November 2026, with magnitudes variously given as 6.4 or 6.5 and an epicenter about 326 km northeast of Rodrigues. Tremors were felt in Mauritius and caused panic, but no immediate deaths, injuries, or major damage were reported. Tsunami information varied across sources, with one report mentioning a tsunami watch for Rodrigues while others said no tsunami warning or threat was issued for Mauritius, Reunion, or Sri Lanka.
