summary: During Prime Minister Balendra Shah's first visit to India since taking office, Indian Prime Minister Narendra Modi offered Nepal a $1.62 billion (240 billion Nepalese rupees) development cooperation package to help it rebuild after the August 26 glacier flood, which Nepali authorities say caused about $4.7 billion in losses; specific details of the package were not immediately disclosed, and the two sides also signed agreements on railway, hydropower and fuel infrastructure. Separately, reporting months after the disaster described survivors in Nuwakot still living with trauma, and a Malaysian relief team finding families and schools continuing to rebuild.
