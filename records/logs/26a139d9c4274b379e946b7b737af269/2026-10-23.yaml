summary: The UN climate loss and damage fund voted to provisionally allocate $20–$21.6 million to Nepal for recovery from the August 26 Bagmati floods, the fund's first-ever allocation for an immediate climate disaster response. Campaigners described the move as historic but emphasized it falls far short of Nepal's multi‑billion‑dollar reconstruction needs.
