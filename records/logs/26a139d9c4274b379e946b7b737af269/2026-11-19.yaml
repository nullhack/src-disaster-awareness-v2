summary: In Timure, Rasuwa, 48 of the 68 households displaced by the August flood have returned to their original area and are living in temporary tents. A disaster risk reduction panel warned that recovery must help businesses restart, not just rebuild roads and infrastructure, while other coverage described aid workers shifting to community rebuilding and examined stalled loss-and-damage financing for Nepal at COP31.
