summary: Experts are debating the future of mega-dams in Nepal after the August Bhotekoshi flood, with reporting describing the avalanche that sent water surging through the rivershed. In Dhading, a floating pontoon bridge is being installed over the Trishuli River to restore road connectivity cut by the Bhotekoshi flash floods. Other selected items repeat India’s $1.62 billion aid package, rescue imagery, community vigils, and reports that adventure tourists continue to visit Nepal.
