summary: Authorities have begun distributing house-rent cash assistance to flood-affected families in Bidur Municipality, Nuwakot, with funds transferred directly into the bank accounts of 970 households. The payments follow the federal government's pledge of rental support for people displaced by the Bhotekoshi flood. Other items in the batch, including reports on India's $1.62 billion aid package and a rescue photo gallery, repeat previously reported material.
