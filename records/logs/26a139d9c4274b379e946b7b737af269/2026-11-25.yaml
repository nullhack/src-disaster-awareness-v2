summary: |-
  Authorities have begun distributing house-rent cash assistance to flood-affected families in Bidur Municipality, Nuwakot, with funds transferred directly into the bank accounts of 970 households. The payments follow the federal government's pledge of rental support for people displaced by the Bhotekoshi flood. Other items in the batch, including reports on India's $1.62 billion aid package and a rescue photo gallery, repeat previously reported material.
  Malaysia has disbursed RM540,000 in financial assistance to the families of 54 Malaysians who were killed or went missing in the August 26 Nepal floods, according to Datuk Seri R. Ramanan. Relatives of the 54 missing victims say they are gradually accepting the reality of the tragedy, and Malaysia's National Registration Department expects to issue certificates of presumed death as early as December, pending verification documents from the Nepali government.
