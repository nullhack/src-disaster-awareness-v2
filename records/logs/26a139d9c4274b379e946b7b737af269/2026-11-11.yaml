summary: At COP31, Nepal’s foreign minister urged global adoption of mountain-specific climate measures in response to the devastating August floods. A feature on the flattened town of Dhunge highlighted the difficult choices survivors face in rebuilding their homes and lives. Separately, an opinion piece argued that the disaster should prompt a fundamental rethinking of Nepal’s development finance approach.
