summary: At the COP31 climate summit in Turkey, Nepal urged world leaders to prioritize the hazards facing mountain countries and pressed for billions in support for disaster survivors, with only about $20 million promised so far against an estimated $2.5 billion in losses. Separately, reporting credited disaster preparedness training supported by Nepal's government and UNICEF's Let Us Learn program with saving lives during the floods. Photo coverage showed Nepali search teams continuing to look for survivors of the Himalayan glacial floods in Kathmandu.
