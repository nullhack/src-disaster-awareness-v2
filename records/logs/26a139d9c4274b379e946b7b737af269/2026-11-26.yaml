summary: Nepal has begun the formal process to declare 213 missing Indian nationals dead from the August 26 floods, with the Indian Embassy urging families to review the published list and submit objections by December 2. Malaysian officials said certificates of presumed death for their missing citizens will be issued once Nepal's confirmation and documents arrive. Separately, Sonoma's Sherpa community raised more than $100,000 for flood relief, and a commentary argued that most current analysis of the Bhotekoshi flooding overlooks the distinctive conditions of Himalayan settlements.
