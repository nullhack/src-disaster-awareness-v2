summary: Malaysia's Social Security Organization (SOCSO) will pay RM174,000 in benefits to the families of 28 out of 54 victims of the August 26 Nepal-Tibet flood, as of November 4. This confirms earlier reports that payments to missing Malaysians' families were being processed.
