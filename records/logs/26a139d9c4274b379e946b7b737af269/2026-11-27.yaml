summary: Three months after the Bhotekoshi floods, a new report describes survivors such as Meena Adhikari of Sole, Nuwakot, still waiting for a government response to their needs. Coverage also continues on the formal process of declaring the 213 missing Indian nationals presumed dead, alongside commentary urging that international climate commitments to Nepal be delivered as grants rather than loans.
