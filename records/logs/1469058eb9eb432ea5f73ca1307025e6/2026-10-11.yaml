summary: |-
  Hurricane Isaias has weakened to a post-tropical cyclone after leaving at least four dead and causing flooded neighborhoods in Fort Walton Beach, with flood watches still active across the Southeast. Tropical Storm Rachel has arrived in Southern California, bringing coastal flooding that forced the closure of all beaches and piers in Newport Beach and prompted a tropical storm watch for San Diego. Additional flood advisories have been issued for areas including McDowell County, and the remnants of Isaias continue to bring heavy rain and wind threats to parts of Tennessee and Virginia.
  A flash flood on Nepal’s Budhi Gandaki River destroyed homes and infrastructure, triggering evacuations and leaving at least five missing. Post-Tropical Cyclone Rachel continued to impact Southern California, with flash flood warnings and a daily rain record in Las Vegas, while a coastal flood advisory was issued for Northern California.
