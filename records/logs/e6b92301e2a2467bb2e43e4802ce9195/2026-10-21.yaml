summary: On Friday, a cold front brings a risk of severe thunderstorms to southeastern Pennsylvania and New Jersey, with damaging wind gusts up to 60–70 mph and a 70–100% chance of rain, followed by frost on Saturday. A severe thunderstorm watch has been issued for New Jersey, and in Connecticut, showers have ended but severe storms are possible this evening.
