summary: A powerful nor’easter unleashed tornadoes, large hail, and flash flooding across the Northeast and Mid-Atlantic. The storms triggered tornado warnings in Delaware and Pennsylvania, disrupted air travel with ground stops and flight diversions from New York airports, and prompted flash flood warnings in New Jersey. Damage included a collapsed hotel sign in Delaware and multiple impacts across the region.
