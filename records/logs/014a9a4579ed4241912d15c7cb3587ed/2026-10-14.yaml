summary: Flash flooding along the Budhi Gandaki River in Nepal has triggered rescue operations with military helicopters and ground troops reaching affected villages. At least five people are reported missing, and over 100 foreign trekkers remain stranded in the region. Among the missing is a Singaporean woman, whose husband has spoken about the tragedy.
