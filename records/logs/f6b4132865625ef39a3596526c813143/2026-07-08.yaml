summary: A magnitude 6.0 earthquake struck off the coast of Japan's Noda region on December 31, 2025, according to the United States Geological Survey. The quake occurred at a depth of about 19.3 km, with the epicenter approximately 91-96 km east of Noda. No immediate reports of damage or casualties were reported.
