summary: Tropical Cyclone TAPAH-25 (referred to as Typhoon Ragasa in some reports) struck southern China, prompting the evacuation of nearly 2 million people. The storm caused at least 17 fatalities, brought severe flooding to Hong Kong, and led to the shutdown of schools and businesses in the region.
