summary: Summer is now California's peak COVID-19 season, according to health officials, as winter outbreaks fade and the virus continues to spread across 43 states. Meanwhile, CDC data shows US kindergarten vaccination rates have declined further and vaccine exemptions hit a record high for the 2025-2026 school year, a trend that has persisted since the pandemic began.
