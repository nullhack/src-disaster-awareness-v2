summary: Two new studies covering more than 1 million U.S. veterans indicate that updated COVID-19 vaccines protect against severe illness. With colder weather and the holidays approaching, doctors are also addressing whether COVID-19 and flu vaccines can be given at the same time. Separately, Moderna shares rose about 3% after its Q3 earnings release, attributed to stronger overseas COVID-19 vaccine sales and higher 2026 guidance.
