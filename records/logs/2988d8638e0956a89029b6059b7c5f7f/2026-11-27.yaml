summary: Invivyd announced positive DECLARATION trial data for its monoclonal antibody VYD2311 (ibramvibart), reporting high, durable antiviral activity predictive of 70–90% protection against symptomatic COVID-19 across single- and multi-dose intramuscular arms, along with a favorable safety and tolerability profile. The company also cited productive dialogue with the U.S. FDA and HHS leadership aimed at aligning regulatory treatment of monoclonal antibodies with related COVID-19 vaccines.
