summary: New research reports that working donkeys in East Africa are routinely overlooked in drought planning, veterinary services, and emergency relief, even though they are essential for transporting water, food, and other supplies during dry periods. The batch otherwise repeats previously reported developments, including Telangana's ₹10,000 crore drought mitigation and climate resilience plan and the remnants of 1700s-era communities exposed by drought at Jordan Lake in North Carolina.
