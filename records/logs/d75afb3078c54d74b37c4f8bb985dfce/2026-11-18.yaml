summary: Recent drought conditions in Carroll County, Mississippi, revealed a stolen car that had been hidden in the Big Black River for 16 years. Barbados remains under a hydrological drought warning for the next four months despite recording its wettest month of the year in October, with very strong El Niño conditions threatening further dry spells. Fiji declared a national state of natural disaster over an ongoing El Niño drought, and the U.S. Small Business Administration made drought-related disaster relief loans available to affected businesses and non-profits.
