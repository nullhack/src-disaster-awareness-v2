summary: Southern Malawi’s drought crisis is compounding with aid cuts after COP31 failed to provide answers, leaving 2.6 million people hungry. In the U.S., the Allentown-area water utility urged customers to cut consumption by 10–15%, exceptional drought expanded across Mississippi and Arkansas, and receding Jordan Lake levels exposed remnants of submerged communities; Wisconsin cranberry growers and Czech carp harvests also reported drought-related losses. A winter outlook suggested a strong El Niño could help alleviate drought conditions.
