summary: |-
  An opinion piece urges California to modernize its water accounting systems to better handle drought shortages. The UN reports on the ongoing struggle and preparedness efforts in Central America's Dry Corridor, where farming families face severe rain deficits. The Philippines' El Niño-related drought losses are approaching ₱10 billion in farm damage.
  Telangana Chief Minister Revanth Reddy met Prime Minister Modi on November 15 to seek drought relief as the state's agricultural crisis deepens. Ahus Island in Papua New Guinea suffers severe water shortages with dry creeks and contaminated rain, while Frankfurt's apple wine orchards are adapting to drought conditions. Colorado Springs Utilities drew down its water storage to the lowest level since 2014 to cope with persistent drought.
