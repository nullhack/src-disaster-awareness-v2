summary: New York’s Drought Watch was expanded to 13 counties, including Onondaga County and parts of the Finger Lakes and Southern Tier. A self-taught farmer in Rajshahi, Bangladesh, developed a drought-tolerant rice variety after seven years of research. The batch also included drought-monitor reporting that one of the driest Octobers on record coincided with expanding drought conditions, along with a map analysis of why Central Europe stands out on drought maps.
