summary: Bohol is seeking a state of calamity declaration after El Niño-driven drought damage there reached P360 million amid worsening drought projections. The Western Cape announced cuts to domestic and industrial water allocations of 7% and irrigation allocations of 15% as dam storage declines, while officials in Sooke and Bend urged residents to conserve water through the winter. Drought in Karnataka has delayed migratory bird arrivals at the Magadi Bird Sanctuary and Ankasamudra Bird Conservation Reserve this winter, and reporting along the Colorado River to Matagorda Bay focused on upstream communities conserving water for the next drought.
