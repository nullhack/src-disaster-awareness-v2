summary: England and Wales are reported to be in a winter drought that could make next summer drier, while Moroccans turned to prayer as a historic drought deepened across the country. Telangana announced a Rs 10,000 crore El Niño and drought mitigation programme to begin after Sankranti, and a new study highlighted tens of thousands of people in France living under water restrictions despite recent rains. In Arizona, Phoenix's stage two drought management plan will impose steep water surcharges on HOAs as commercial users.
