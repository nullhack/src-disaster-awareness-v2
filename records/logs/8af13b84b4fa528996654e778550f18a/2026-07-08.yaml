summary: The previously undiagnosed disease in the Democratic Republic of the Congo has been identified as a combination of malaria, influenza, and malnutrition, according to a report published on January 16, 2025. This finding clarifies the nature of the acute respiratory infections complicated by malaria that had been reported in December 2024.
