summary: A newly reported analysis found no definitive link between the hantavirus strain responsible for the cruise ship outbreak and the outbreak strain circulating in Argentina, undercutting the assumption of a straightforward common source. Separately, a University of Geneva study was described as pinpointing the origin and mode of transmission of the Andes virus that spread aboard the cruise ship. Other coverage in this batch revisits earlier developments, including the evacuation of three patients and the hypothesis that a couple was infected during a bird-watching outing before boarding, while a Bariloche hospital report describes a hantavirus patient improving without specifying any connection to the ship cluster.
