summary: Two newly published studies traced the Andes virus behind the fatal South Atlantic cruise ship outbreak to an established viral lineage from northern Patagonia, addressing both how the virus spread among passengers and crew and where the infection originated. A separate, earlier-dated report recapped the outbreak's initial phase, when WHO was examining seven cases—three deaths, one critically ill passenger removed from the ship, and three onboard with mild symptoms.
