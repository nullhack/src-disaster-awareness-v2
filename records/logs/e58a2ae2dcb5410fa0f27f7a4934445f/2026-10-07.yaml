summary: Tropical Storm Isaias formed in the Gulf of Mexico on October 7, 2026, and is expected to rapidly intensify into a hurricane, possibly a Category 3, by early Thursday. Hurricane watches and warnings have been issued for portions of the Gulf Coast, with the storm forecast to bring heavy rain, strong winds, and storm surge from Louisiana to Florida.
