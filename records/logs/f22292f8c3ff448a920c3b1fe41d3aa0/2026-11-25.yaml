summary: New polling showed about two-thirds of Americans disapprove of President Trump's handling of the Russia-Ukraine war, while a majority of Germans oppose additional weapons deliveries to Ukraine. BBC analysis of leaked Russian government data indicated roughly 490,000 Russian military deaths, with another projection putting the figure above 700,000. Two Libyan naval officers died from the Ukrainian drone attack on a Russian warship at Benghazi, Melania Trump oversaw the return of a seventh group of Ukrainian and Russian children to their families, and a reporter said Ukrainian journalists were outnumbered 30 to 1 by Russian propagandists during the Oleshky evacuation.
