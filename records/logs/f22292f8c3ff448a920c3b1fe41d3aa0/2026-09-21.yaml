summary: |-
  On September 20-21, 2026, Ukraine launched its largest-ever drone attack on Moscow, striking the Kapotnya oil refinery and Sofyino logistics complex, killing at least four people and causing fires. President Zelensky confirmed the strikes, while President Trump reportedly urged him to stop hitting Russian refineries, and Russia's ruling party appeared set to win parliamentary elections held under the attack. Additionally, a report warned Ukraine could lose up to 6.8% of GDP in 2027 if the war continues.
  Ukraine launched its largest drone attack on Moscow using a new homemade ballistic missile (FP-7 'Pelican'), killing at least three people. President Zelenskyy will meet President Trump at the UN General Assembly in New York, as Trump publicly presses Ukraine to stop striking Russian refineries. Russia's budget deficit is set to hit 3% of GDP, and over 300 vessels have been damaged in Russian attacks on Ukrainian ports.
