summary: U.S. envoy Jared Kushner said in Berlin, after briefing European allies with Steve Witkoff, that Russia is "comfortable" with NATO-like security guarantees for postwar Ukraine, as Washington sought to reassure Kyiv's partners about Trump's meeting with Putin in China. The Trump–Putin–Xi trilateral in Shenzhen produced a "Declaration on Peace" that reportedly made no mention of Ukraine, and Trump questioned Europe's billions in Ukraine aid during a call to allied leaders from Air Force One. Meanwhile, Ukraine struck the Crimean/Kerch bridge for a third time in four days and Putin vowed retaliation, while UK Prime Minister Andy Burnham said Europe is "ready to enter negotiations."
