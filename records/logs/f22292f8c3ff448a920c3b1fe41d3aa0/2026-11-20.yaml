summary: |-
  U.S. envoy Jared Kushner said in Berlin, after briefing European allies with Steve Witkoff, that Russia is "comfortable" with NATO-like security guarantees for postwar Ukraine, as Washington sought to reassure Kyiv's partners about Trump's meeting with Putin in China. The Trump–Putin–Xi trilateral in Shenzhen produced a "Declaration on Peace" that reportedly made no mention of Ukraine, and Trump questioned Europe's billions in Ukraine aid during a call to allied leaders from Air Force One. Meanwhile, Ukraine struck the Crimean/Kerch bridge for a third time in four days and Putin vowed retaliation, while UK Prime Minister Andy Burnham said Europe is "ready to enter negotiations."
  Russia launched a large missile and drone barrage at Ukraine — more than 110 missiles, including 27 ballistic, and over 400 drones — shortly after Putin met with Trump. During the attack, two Russian Kh-101 missiles and a drone came down in Poland, prompting Warsaw to activate air defenses and seek NATO support over the airspace violation. UNICEF reported that child deaths and injuries in Ukraine this year have already surpassed recent levels and are approaching 2022 figures.
