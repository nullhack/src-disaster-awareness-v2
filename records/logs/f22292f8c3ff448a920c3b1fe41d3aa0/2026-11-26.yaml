summary: |-
  US envoy Jared Kushner said Vladimir Putin had agreed not to use nuclear weapons even as negotiations on the territorial question reached a "complete impasse," and separately warned against any escalation of what he called a "proxy war." Ukraine said its forces struck a major Russian military base and destroyed five warplanes, with Kyiv telling Putin to "stop complaining" about attacks on Russian infrastructure. Reporting also examined Russia's use of Nvidia computer modules to pilot a drone that killed Ukrainian civilians, while Metinvest's chief warned the future of Ukraine's steel industry is in doubt amid fresh bombardment and EU tariff hikes.
  President Trump and NATO Secretary General Mark Rutte met at Mar-a-Lago and jointly urged Russia to avoid "any actions" that would expand the war with Ukraine. Britain has alerted about 100,000 military veterans to a possible wartime call-up amid rising tensions with Russia. NATO nations are also voicing growing anxiety over the war spreading to new regions as Ukraine attacks Russian ships in distant waters, while a Moscow court in the annexed Donetsk region sentenced a Colombian to 20 years for fighting for Kyiv.
