summary: Trump declined to call Putin a friend of the United States while praising their personal relationship, speaking amid renewed Russian attacks on Ukraine and disagreement over postwar security guarantees. Polish PM Donald Tusk condemned a Russian Kh-101 missile crash in Poland as an intentional provocation during allied drills, and reporting said the Kremlin is reviving prewar demands as Washington raises discussing European security. Zelenskyy demanded that the Pentagon release Patriot missiles even as reports said the US has largely exhausted its own supply.
