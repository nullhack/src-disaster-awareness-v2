summary: Leaked Russian civil registration records revealed the deaths of 23 Zimbabwean men who fought in the war against Ukraine, with most killed in Donetsk Oblast where fighting has been most intense. President Zelenskyy said the new U.S. Congress should force Putin to end the war if Trump's peace push fails, saying Washington appears politically to be "pursuing the same course as Putin." Reporting also documented how electricity and water shortages have become part of daily life in Ukraine's capital.
