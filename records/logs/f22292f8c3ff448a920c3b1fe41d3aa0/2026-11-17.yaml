summary: |-
  Ukraine struck the Crimea bridge in what Russia called the war's largest drone attack, while President Zelensky said U.S. negotiators floated the idea of trading Ukrainian territory for NATO membership and appealed to Trump and Musk to lift Starshield "restrictions." Reporting also described a covert French mission training Ukrainian troops inside the country, car bombings in Moscow and St. Petersburg that killed a Russian military officer and critically injured an adviser to a former Ukrainian prime minister, and an early Russian bombing campaign aimed at stripping Kyiv and other cities of heat, water and sanitation this winter. Bunge Global separately reported damage to its oilseed refining facilities in Ukraine.
  Ukraine struck the bridge linking mainland Russia to occupied Crimea for a second consecutive night, with President Zelenskyy confirming the operation targeted Russian defenses around the crossing and Moscow acknowledging structural damage to the span; Russian missiles, meanwhile, damaged two major bridges in Kyiv. The exchanges took place days before a planned Trump-Putin-Xi meeting, and Kushner described a US postwar plan for Ukraine resting on security guarantees, a path toward EU accession, and an economic recovery program. France's foreign minister also insisted Paris is not a "co-belligerent" despite French personnel training Ukrainian soldiers, while Russian lawmakers moved to toughen penalties for war-related offences.
