summary: Ukraine struck the Crimea bridge in what Russia called the war's largest drone attack, while President Zelensky said U.S. negotiators floated the idea of trading Ukrainian territory for NATO membership and appealed to Trump and Musk to lift Starshield "restrictions." Reporting also described a covert French mission training Ukrainian troops inside the country, car bombings in Moscow and St. Petersburg that killed a Russian military officer and critically injured an adviser to a former Ukrainian prime minister, and an early Russian bombing campaign aimed at stripping Kyiv and other cities of heat, water and sanitation this winter. Bunge Global separately reported damage to its oilseed refining facilities in Ukraine.
