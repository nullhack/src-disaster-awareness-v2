summary: Suspected Ukrainian sea drones struck a Russian warship docked at the Benghazi naval base in Libya, sinking the vessel in a large explosion — an attack on Russian assets far from the Ukrainian front. Libyan officials warned that the country's territory must not be "turned into an arena for settling scores." Separately, a Levada poll found that only 6% of Russians believe Russia should answer for the destruction in Ukraine, while 65% blame the United States and NATO.
