summary: Ukraine struck the Crimean Bridge again in what was described as a third blow, with Kyiv saying the attacks were carried out without Musk’s Starlink; Musk separately accused Zelenskyy of lying about Starshield restrictions. Two major Russian oil refineries were struck on the eve of a Trump-Putin-Xi summit, and a report said employees of Dutch arms maker Destinus took part in the war. Russian attacks have left Kyiv with devastating power outages, with Mayor Vitali Klitschko facing blame.
