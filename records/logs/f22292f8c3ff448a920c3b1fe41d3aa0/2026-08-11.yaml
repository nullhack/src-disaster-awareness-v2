summary: On August 10, Ukraine struck a Russian petrochemical plant over 2,000 kilometers inside Russia, as Moscow races to expand missile production. A separate Russian drone strike on August 1 destroyed about 8 million books at a warehouse in Kharkiv. These attacks continue the pattern of Ukraine targeting Russian industrial infrastructure while Russia intensifies strikes on Ukrainian civilian centers.
