summary: |-
  US Secretary of State Rubio stated there is growing international interest in a limited Black Sea ceasefire and that Washington is reviewing proposals from Turkey and India to resume grain shipments. At the G20 in Atlanta, the group photo was canceled due to European objections to Russia, and Russia's Lavrov said Zelenskyy's comments are hindering peace talks. Meanwhile, evacuees from the Oleshky humanitarian ceasefire reached Belarus, and Indian Foreign Minister Jaishankar discussed the Ukraine conflict with his Russian, Polish, and South Korean counterparts.
  A Ukrainian drone strike set a Russian oil refinery ablaze in Kstovo, and Russian airstrikes hit Kramatorsk. US Secretary of State Rubio spoke with Lavrov about a potential Trump-Putin interaction at APEC. Bulgaria held a presidential runoff amid divisions over Russia and Black Sea attacks, and the Pentagon watchdog refused to investigate Starlink disruptions in Ukraine.
