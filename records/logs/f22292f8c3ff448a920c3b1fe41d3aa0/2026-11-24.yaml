summary: |-
  Ukraine confirmed that naval drones sank the Russian warship Merkury and damaged a sanctioned Russian cargo vessel off Libya on Nov. 22, expanding its maritime operations far from the front. Leaked death-certificate data showed more than 1,000 Russian military suicides, while new estimates put Russian battlefield deaths above 700,000. Zelenskyy said intelligence indicated Russia is planning new strikes on Ukraine, as over 350,000 homes in Dnipropetrovsk Oblast remained without power after Nov. 21-22 attacks.
  Ukraine's sea-drone attack off Libya that sank the Russian corvette Merkury — a Steregushchiy-class vessel delivered to the Russian Navy in 2023 — drew a public warning from a former U.S. national security adviser that the strike risks "serious escalation," while President Zelenskyy credited Ukrainian intelligence services with the operation. Director of National Intelligence Jay Clayton said Trump calling Putin a "friend" was "entirely appropriate" while stressing Putin is "not America's friend in Ukraine," and German Chancellor Friedrich Merz and NATO Secretary General Mark Rutte announced a further intensification of the military confrontation with Russia at a Berlin meeting.
  Ukrainian officials insisted that the naval drone attack which sank the Russian corvette Merkury off Libya was an act of self-defense, rejecting condemnation from Libya's Government of National Unity, while a Russian strike on Ukraine killed two people and wounded 48. Poland accused Moscow of deliberately violating its airspace with a drone incursion on November 24, and British officials warned UK companies assisting Ukraine to brace for Russian sabotage attempts. NATO Secretary General Mark Rutte warned that Russia's war machine runs at full speed and could threaten Europe before a European army is ready, as leaked data suggested roughly 720,000 Russian soldiers lost in the war and a fall in male life expectancy to 65.3 years.
