summary: Ukraine confirmed that naval drones sank the Russian warship Merkury and damaged a sanctioned Russian cargo vessel off Libya on Nov. 22, expanding its maritime operations far from the front. Leaked death-certificate data showed more than 1,000 Russian military suicides, while new estimates put Russian battlefield deaths above 700,000. Zelenskyy said intelligence indicated Russia is planning new strikes on Ukraine, as over 350,000 homes in Dnipropetrovsk Oblast remained without power after Nov. 21-22 attacks.
