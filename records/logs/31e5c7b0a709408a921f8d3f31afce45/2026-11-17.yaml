summary: Ukrainian strikes partially destroyed the Kerch Bridge linking Russia to occupied Crimea, an attack Zelenskyy cast as retaliation for continued Russian attacks, while Russia and Ukraine exchanged large-scale strikes for a second straight day, damaging critical bridges in Crimea and Kyiv. Separately, Iran targeted US military facilities in Bahrain three times in five days, ending a roughly two-month lull, as the USS Theodore Roosevelt carrier strike group arrived in the region. Trump's pick for Navy secretary acknowledged that the Iran war is straining US military resources.
