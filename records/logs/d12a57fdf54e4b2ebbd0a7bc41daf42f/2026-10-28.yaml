summary: The U.S. Embassy in Panama partnered with American companies and private sector partners to deliver aid following the 7.7-magnitude earthquake. Secretary of State Marco Rubio spoke with Panamanian President José Raúl Mulino to discuss earthquake recovery. Panama also received a shipment of tents from a United States organization to assist victims.
