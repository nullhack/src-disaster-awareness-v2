summary: Maiquetía International Airport, Venezuela's main airport serving Caracas, has partially resumed commercial flights nearly 10 weeks after the June 24 twin earthquakes caused severe damage and forced its closure. A Conviasa flight to Mexico and a Global Crossing arrival marked the reopening of temporary terminals, with operations partially restarting to aid recovery and connectivity.
