summary: Three months after the twin earthquakes, family members and volunteers continue searching collapsed buildings for their missing loved ones, with at least 1,500 people still unaccounted for. Separately, New Zealand engineers who traveled to Venezuela to assist in the aftermath are sharing lessons on earthquake resilience, highlighting that nearly 200 buildings collapsed and more than 16,000 structures were deemed unsafe.
