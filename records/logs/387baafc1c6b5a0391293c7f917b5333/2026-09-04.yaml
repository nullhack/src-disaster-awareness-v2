summary: Venezuela's main international airport at Maiquetía partially resumed commercial flights nearly 10 weeks after the June 24 twin earthquakes, operating at reduced capacity through temporary terminals while repairs continue. Separate reports highlight that drones deployed in the disaster response saved more than 6,600 lives, though airspace management challenges emerged due to connectivity failures.
