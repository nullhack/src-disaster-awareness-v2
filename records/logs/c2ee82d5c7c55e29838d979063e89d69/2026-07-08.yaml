summary: In mid-April 2025, a vaccine-derived poliovirus type 2 strain was detected for the first time in Australia through wastewater testing in Perth. Health officials indicate the strain likely came from an overseas traveller, though a specific country is not confirmed. This detection highlights the international spread of cVDPV2 and has triggered enhanced monitoring.
