summary: Flooding and landslides in Ecuador have left nine provinces cut off from the rest of the country, triggering a large-scale rescue operation amid concerns about epidemics. The floods destroyed rural roads and damaged cocoa bean quality, pushing cocoa futures prices sharply higher. Standing water from El Niño-driven rains has also intensified a dengue outbreak, with reported cases surpassing 43,000 nationwide.
