summary: Vatican News reports that more than 100,000 people in Ecuador have been affected by heavy rains and flooding that have continued since late August. Ecuador’s electoral council has set out and tested a flood evacuation protocol for polling sites ahead of the 29 November 2026 local elections. A commodities article also notes that Ecuador has logged 851 floods since late August.
