title: Russia Asks if Netherlands Is Joining Ukraine War After Dutch Company's Missiles Used in Bridge Attack - The Moscow Times
body: The Russian Embassy in the Netherlands on Wednesday posted a statement asking if the Netherlands had openly joined the conflict in Ukraine on Kyiv's side after a Dutch-based company said its missiles had been used by Ukraine in an attack on the Crimean Bridge.
