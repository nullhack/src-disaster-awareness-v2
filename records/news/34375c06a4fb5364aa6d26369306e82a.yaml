title: Leaked Russian records reveal deaths of 23 Zimbabweans in Ukraine war - Zimbabwe Situation
body: Leaked Russian civil registration records have shed new light on the deaths of 23 Zimbabwean men who fought in the war against Ukraine, revealing that most died in areas of eastern Ukraine where fighting has been intense. The highest number of deaths was recorded in Donetsk Oblast, also known as Donechchyna, which forms part of […]
