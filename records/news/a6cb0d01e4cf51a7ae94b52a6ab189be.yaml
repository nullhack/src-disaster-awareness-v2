title: Residents, city reflect on spring wildfires as drought conditions continue - The Independent Florida Alligator
body: Three wildfires threatened Gainesville’s city limits in the spring. Smoke clogged the air, and State Route 26, North Main Street, state Route 121 and the surrounding regions were impacted by road closures and forced evacuations.The blazes, which sparked fear and confusion among residents but may ultimately benefit the ecosystem, point to shifting weather patterns as the county nears a year of drought conditions.
