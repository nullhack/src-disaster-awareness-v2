title: Helicopter helps stop 4.5-acre woods fire after burn pile escapes in Hiram
body: Burn pile in Hiram, Maine spread into nearby woods, scorching about 4.5 acres, Baldwin Fire says. Forestry units and a Maine Forest Service helicopter helped contain it. Crews doused hotspots; no injuries.
