title: Congo Ebola Outbreak Defies Control as Conflict, Hunger Fuel Crisis Six Months In
body: Six months into the biggest Ebola outbreak in the Democratic Republic of Congo’s history, containing the virus increasingly depends on solving problems far beyond the disease — hunger, armed conflict, mistrust and a health system already buckling under the strain.
