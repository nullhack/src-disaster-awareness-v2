title: 'These women are Nepal''s unsung heroes: shattered by the floods yet helping survivors'
body: The floods of August took many lives, destroyed homes, hospitals and schools. Aid workers are taking up the hard work of rebuilding communities that suffered — even though they, too, saw great losses.
