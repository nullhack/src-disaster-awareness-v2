title: Ebola outbreak remains out of control in Congo 6 months into response
body: More than 11,000 cases have been recorded, and nearly half of those infected have died, according to government data. It is the deadliest of Congo’s 17 outbreaks and is on track to surpass the death toll from the West African outbreak that killed 11,000 people between 2014 and 2016.
