title: Nebraska Forest Service rebuilds after historic wildfires this year
body: After a record setting number of acres burned across wildfires this year, Nebraska Forest Service is looking to salvage the damaged areas. With $24 million secured in federal funding, NFS sets their sights on the areas that can still be saved.
