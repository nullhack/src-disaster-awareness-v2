title: Magnitude 5.9 earthquake strikes Indonesia's Flores, GFZ says
body: An earthquake of magnitude 5.9 struck Indonesia's Flores on Wednesday, the German Research Centre for Geosciences said. The quake struck at a depth of 10 km (6 miles), the agency said.
