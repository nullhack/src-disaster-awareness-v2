title: Trump asked about Russia being Iran's ally. He dodges question, calls Putin a friend
body: Donald Trump declined to call Vladimir Putin a friend of the United States but praised their personal relationship. His remarks came amid renewed Russian attacks on Ukraine and disagreement over post-war security guarantees.
