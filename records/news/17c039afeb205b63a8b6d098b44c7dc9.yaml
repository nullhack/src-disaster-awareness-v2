title: Kushner says he believes Russia is ‘comfortable’ with NATO-like security guarantees for Ukraine
body: BERLIN — U.S. envoy Jared Kushner said Thursday he believes Russia is “comfortable” with NATO-like security guarantees for postwar Ukraine, while Kyiv’s European allies expressed concerns about President Donald Trump’s meeting in China with the Kremlin leader.
