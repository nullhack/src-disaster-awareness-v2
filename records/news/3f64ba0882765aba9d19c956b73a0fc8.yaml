title: Akawa fire impacts on herd migration
body: Each fall, as snow builds in the high Cascades, mule deer and elk start moving downhill. They leave summer range for the lower, drier country around Sisters, Tumalo, Bend, and the Metolius Basin. There, the snow is thinner, the forage is within reach, and the juniper and sagebrush offer cover from wind and weather. Winter is the hardest season for...
