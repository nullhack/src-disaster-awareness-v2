title: 'Employees of Dutch arms firm Destinus taking part in Ukraine war: report'
body: Employees of the Dutch arms manufacturer Destinus have themselves participated in the war in Ukraine, NRC reported following a months-long investigation and interviews with over 40 people involved. They have hunted Russian drones in Ukraine and also assisted the Ukrainian military in launching attack drones toward Russia, dating back as far as 2023.
