title: As Ukraine attacks Russian ships, Merz and Rutte drive escalation of war against Russia
body: As the Ukraine war continues to spread, with attacks on Russian ships in the Baltic and Mediterranean seas, German Chancellor Friedrich Merz and NATO Secretary General Mark Rutte announced a further intensification of the military confrontation with Russia at another meeting in Berlin on Monday.
