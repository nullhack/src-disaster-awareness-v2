title: Using AI to provide new insights into why Ebola outcomes differ between patients
body: There is currently a serious outbreak in the Democratic Republic of the Congo of the severe and often fatal illness. Symptoms include fever, vomiting, diarrhea, severe dehydration and hemorrhage. Rapid clinical deterioration is common. University of Liverpool researchers have led two major new studies into Ebola virus disease (EVD) and factors that influence and predict patient outcomes.
