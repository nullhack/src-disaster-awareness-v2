title: El Niño threatens Southeast Asia's data center expansion as water risks mount, says BMI - TNGlobal
body: Southeast Asia's rapidly expanding data center sector faces growing risks from water shortages as the return of El Niño could intensify drought conditions, increase public scrutiny of water consumption and potentially delay planned projects in the region, BMI Country Risk and Industry said on Monday.
