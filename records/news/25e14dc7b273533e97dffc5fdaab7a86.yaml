title: Typhoon Inday approaches southern Japan, Signal No. 2 remains over Batanes
body: Typhoon Inday is now approaching Sakishima islands in Southern Japan as Signal No. 2 remains over Batanes, according to the Tropical Cyclone Bulletin posted by PAGASA early Saturday morning.
