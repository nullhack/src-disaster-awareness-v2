title: No tsunami threat to Sri Lanka following Mauritius–Réunion earthquake
body: The National Tsunami Early Warning Centre has confirmed that there is no tsunami threat to Sri Lanka following a 6.5-magnitude earthquake that struck the Indian Ocean region near Mauritius and Réunion this afternoon (24).
