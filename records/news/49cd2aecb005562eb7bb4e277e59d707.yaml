title: Kremlin Accuses Ukraine of Trying to Widen Conflict Zone to Mediterranean and Baltic Seas
body: MOSCOW, Nov 26 (Reuters) - The Kremlin on Thursday accused Ukraine of trying to spread the war it is fighting against Russia to the Mediterranean and Baltics seas, a move it called very dangerous.
