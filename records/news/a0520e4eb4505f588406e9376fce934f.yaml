title: Riyadh’s tallest skyscraper struck by Houthi missile attack
body: Riyadh’s tallest skyscraper was struck by a Houthi attack in the latest blow to the kingdom in its war with the Iran-backed Yemeni group. Saudi Arabia’s civil defense said a Houthi attack on a tower in Riyadh’s financial center caused material damage to several floors of the building and nearby buildings, but no injuries were reported.
