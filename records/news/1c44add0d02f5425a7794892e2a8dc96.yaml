title: State of calamity declared in Isabela
body: TUMAUINI, Isabela — Isabela province has declared a state of calamity after incurring P2.881-billion crop losses in agriculture, mostly in corn and palay (unmilled rice) farms, due to severe drought that has been prevailing since July this year.
