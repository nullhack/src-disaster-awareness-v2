title: DR Congo Ebola outbreak spreads to remote areas as violence hampers response
body: The Ebola outbreak in the Democratic Republic of the Congo has claimed 5,505 lives, with over 11,000 confirmed cases in six months. WHO warned that ongoing violence, poor healthcare access and funding shortages are hampering containment efforts, particularly in rural communities
