title: A tornado warning in Northern California? Inside a tiny coastal school’s El Niño emergency
body: A rare tornado warning sent students and staff at a Santa Cruz County elementary school scrambling for shelter Monday, as the Bay Area braces for El Niño storms. The tornado never formed, but exposed gaps in emergency readiness.
