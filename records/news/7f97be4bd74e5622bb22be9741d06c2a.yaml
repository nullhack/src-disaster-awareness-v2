title: Severe drought pushes millions in Afghanistan deeper into crisis
body: Afghanistan is in the throes of a severe economic crisis. Last year, nearly three-quarters of the population was living in poverty, according to the United Nations. Now, millions of Afghans are facing drought and have no access to safe drinking water. Special correspondent Leila Molana-Allen and videographer Eric O'Connor traveled to the Bamyan province, one of the country's poorest regions.
