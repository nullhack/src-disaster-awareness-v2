title: Strong Peru quake prompts Lima evacuations
body: A magnitude 6.8-6.9 earthquake struck Peru's central Andes near Junín, shaking Lima and prompting residents and lawmakers to leave buildings. No immediate damage or casualties were reported, and officials said there was no tsunami threat.
