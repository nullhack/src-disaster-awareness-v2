title: Global wine output falls as Italy records second-smallest harvest this century
body: Global wine production is expected to reach 225 million hectolitres in 2026, around 7% below the five-year average, according to new figures from the International Organisation of Vine and Wine (OIV). While Spain and South Africa recorded stronger harvests, falling production in Italy, Australia and the United States kept global output close to historically low levels.
