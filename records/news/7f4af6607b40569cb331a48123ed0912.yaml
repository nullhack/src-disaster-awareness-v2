title: Powerful 6.9-magnitude earthquake strikes off northern Japan. No tsunami warning
body: TOKYO (AP) — A powerful earthquake struck off Japan’s northern coast on Thursday, but the country’s meteorological agency said there was no danger of a tsunami.
