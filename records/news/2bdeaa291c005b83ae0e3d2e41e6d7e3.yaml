title: US Army team expected defeat by Ukrainian drone crews to serve as wake-up call for military leaders
body: The US Army team that arranged Ukrainian participation in the Combined Resolve military exercise in Germany in April and May 2026 expected American forces to suffer a major defeat, hoping the experience would accelerate the adoption of drones across the US military.
