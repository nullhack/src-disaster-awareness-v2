title: South Africa Moves To Verify Nationality of Pilot Captured In The DRC - The Bulrushes
body: Pretoria – The South African Government says it is taking steps to verify the nationality of the pilot reportedly captured in the eastern Democratic Republic of the Congo (DRC). Unverified reports say the captured pilot is South African. Pictures of the captured pilot with a bandaged head and video clips of his downed plane have […]
