title: Powerful earthquake in China’s Tibet region collapses hundreds of homes and kills at least 16 people
body: BEIJING (AP) — A magnitude 7 earthquake hit China's Tibet region on Thursday evening, killing at least 16 people, injuring 54 and collapsing hundreds of homes in the northern regional city of Nagqu, official media said.
