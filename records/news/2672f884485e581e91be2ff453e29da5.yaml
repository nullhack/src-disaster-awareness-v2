title: IRGC says Iran International is among its military targets
body: Iran International is among the military targets of the Islamic Republic's armed forces, IRGC spokesman Hossein Mohebbi said Thursday, renewing an earlier threat against the London-based broadcaster amid a series of plots and attacks targeting its journalists.
