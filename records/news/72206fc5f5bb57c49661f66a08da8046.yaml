title: Africa has months of El Niño warning. Are health systems ready?
body: Forecasters gave authorities months to prepare for heavier rains in parts of Africa and drought in others. As COP31 meets in Turkey, funding gaps are making it harder to turn those warnings into protection for clinics and communities.
