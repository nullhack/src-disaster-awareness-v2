title: Ebola has spread from Congo to 4 other countries. A look at where things stand
body: Ebola disease from the fast-moving outbreak in Congo has now spread to four other countries, including two where it's active. It has spread farther across Africa than any previous Ebola outbreak, reaching three regions.
