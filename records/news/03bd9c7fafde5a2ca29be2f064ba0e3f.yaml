title: 'Tremors in Te Anau: South Island Quake Alert | Science-Environment'
body: A magnitude 5.9 earthquake struck near Te Anau, New Zealand, leading to temporary tsunami warnings. The quake, initially recorded at 6.3, was downgraded. No injuries or damage were reported. Authorities cautioned about unusual coastal surges, while local residents described the tremors as strong but not destructive.
