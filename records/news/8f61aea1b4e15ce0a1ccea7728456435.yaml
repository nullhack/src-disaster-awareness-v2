title: First successful human challenge model for dengue serotype 4 could speed vaccine and drug testing
body: Researchers at the University of Maryland School of Medicine (UMSOM) and the Institute of Human Virology (IHV) have developed the first successful human challenge model for dengue serotype 4, a major advance that could speed the development of new drugs and vaccines against a strain of the dengue virus that remains difficult to study.
