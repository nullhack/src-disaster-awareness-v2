title: Trump Calls ICC ‘Out Of Control’ At Xi-Putin Trilateral Meeting On APEC Summit 2026 Sidelines | Outlook India
body: Donald Trump calls the ICC ‘out of control’ at the Xi Jinping-Putin trilateral meeting that were held on APEC 2026 summit sidelines in Shenzhen. Nuclear weapons, the Ukraine war, Iran conflict and US-China-Russia ties feature in the summit.
