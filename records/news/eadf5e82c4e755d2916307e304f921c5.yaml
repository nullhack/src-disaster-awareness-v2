title: Florida reports fewer dengue investigations but Tampa Bay outbreak persists
body: Hillsborough, Pinellas and Pasco accounted for 92 of Florida’s 100 new locally acquired infections in the most recent report. However, the number of cases the health department has under review decreased in recent weeks.
