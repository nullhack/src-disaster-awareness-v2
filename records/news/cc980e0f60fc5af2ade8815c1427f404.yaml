title: 'Costlier tickets, fewer flyers: Fuel surcharges and West Asia conflict hit air travel in India - CNBC TV18'
body: Indian airlines have introduced fuel surcharges of ₹375 to ₹1,200 on domestic tickets amid a 46.5% surge in jet fuel prices and West Asia airspace closures, leading to a dip in air travel demand, according to a new ICRA report.
