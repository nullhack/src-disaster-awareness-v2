title: No tsunami threat to Philippines after magnitude 6.5 Vanuatu quake – PHIVOLCS
body: The Philippines faces no tsunami threat following a magnitude 6.5 earthquake that struck the Vanuatu Islands region on Monday morning, Nov. 23, the Philippine Institute of Volcanology and Seismology (PHIVOLCS) said. The earthquake occurred at 10:41 a.m. Philippine time at a depth of 615 kilometer...
