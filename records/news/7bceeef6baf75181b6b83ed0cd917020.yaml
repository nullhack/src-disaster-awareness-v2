title: Indonesia fires test palm oil certification scheme as NGOs question RSPO accountability
body: JAKARTA — Environmental groups are questioning the effectiveness of a global organization that develops standards and certification for sustainable palm oil production after fires affected thousands of hectares in concessions belonging to its members in Indonesia — including areas certified under its sustainability scheme. The criticism came as the organization, the Roundtable on Sustainable Palm […]
