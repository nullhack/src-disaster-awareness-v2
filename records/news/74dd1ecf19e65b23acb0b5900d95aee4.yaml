title: New UH tool allows Hawaii residents to track rainfall, drought where they live
body: Starting July 1, people in Hawaii can get free monthly climate updates specifically tailored to the state, individual islands, neighborhoods and coastlines delivered straight to their inbox. Developed by the University of Hawaii, the Hawaii Climate Data Portal is a new monthly climate summary tool that compiles complex metrics into easy-to-read localized updates on rainfall, […]
