title: Two studies provide new insights into deadly cruise ship Andes virus outbreak
body: 'Investigators faced two urgent questions when an outbreak of Andes virus emerged aboard a cruise ship traveling across the South Atlantic in April 2026: how the virus spread among passengers and crew, and where the infection originated.'
