title: Heavy fall rains gave Lake Powell a lifeline. Will it be enough?
body: Fall rains gave a big boost to Lake Powell. The feds' latest forecast shows the reservoir staying above critical elevation levels for hydropower and downstream releases next year. But winter snow will ultimately determine how well Powell fares.
