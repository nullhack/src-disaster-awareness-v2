title: अभी-अभी आया 6.7 तीव्रता का भूकंप, घर-ऑफिस से निकल भागे लोग, रिंग ऑफ फायर में मची हलचल
body: 28 नवंबर की शाम को रूस के एकदम छोर वाले पूर्वी इलाके में भूकंप आया. ये झटका कामचटका प्रायद्वीप के येलिजोवो के पास महसूस किया गया. भूकंप की तीव्रता 6.7 थी, इससे रिंग ऑफ फायर इलाके में हलचल मच गई. डर के मारे लोग घरों और दफ्तरों से बाहर निकल आए. ये झटका करीब 188 से 205 किलोमीटर की मध्यम गहराई पर आया था.
