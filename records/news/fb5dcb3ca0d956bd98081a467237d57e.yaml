title: Terremoto de magnitud 6,6 sacude Indonesia y se siente en el norte de Australia
body: El sismo tuvo su epicentro en el mar de Banda, cerca de las islas Molucas. Las autoridades descartaron una amenaza de tsunami y no reportaron daños.
