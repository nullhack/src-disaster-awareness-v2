title: 17 reported dead from Inday, habagat
body: Coupled with the enhanced habagat or southwest monsoon, Typhoon Inday has left at least 17 people dead, nine others missing and more than 500,000 people affected across the country, the National Disaster Risk Reduction and Management Council reported yesterday.
