title: Out of state 'I Voted' stickers for Alex Pretti memorial flood Glam Dolls Donuts’ mailbox
body: Minneapolis bakery Glam Doll Donuts has received over 100 mailed in “I Voted” stickers from across the nation. Memorial caretakers are adding these stickers around the site already covered in hundreds of local November election “I Voted” stickers.
