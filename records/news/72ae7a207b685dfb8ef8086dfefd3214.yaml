title: The Iran war has companies stockpiling like the Pentagon, and just-in-time is losing its grip
body: Swiss packaging maker SIG built €80 million in extra inventory in the first half, and 81% of businesses in a BSI survey are stockpiling or about to. The Pentagon’s plan runs on the same logic.
