title: '2 more provinces affected as DR Congo Ebola outbreak remains "very active": health minister'
body: KINSHASA, July 9 (Xinhua) -- The ongoing Ebola outbreak in the Democratic Republic of the Congo (DRC) has now affected the provinces of Tshopo and Haut-Uele, as the epidemic remains in a "very active" phase, Health Minister Roger Kamba said on Thursday.
