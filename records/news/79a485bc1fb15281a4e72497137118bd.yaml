title: 'State’s doc to New Yorkers as flu spikes: Get vaccinated'
body: “Last year, thousands of New Yorkers were hospitalized and more than 1,000 died from flu and COVID,” McDonald said. “Last year does not have to be this year. As the State’s doctor, I encourage all New Yorkers to get their seasonal immunizations. Vaccination is the best protection to help keep ourselves and our families healthy.”
