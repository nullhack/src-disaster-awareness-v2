title: Akvan revives haunting memories of 1977 Diviseema super cyclone
body: As Cyclone Akvan approaches Andhra Pradesh coast, residents of Diviseema region in Krishna district are recalling one of the deadliest natural disasters in the state’s history — the devastating super cyclone of Nov 19-20, 1977, which killed nearly 14,000 people and left a trail of destruction across coastal villages.
