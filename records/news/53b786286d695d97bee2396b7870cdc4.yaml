title: Maine Forest Rangers blame downed power line for Woodstock fire
body: Maine Forest Rangers say a downed power line sparked the Woodstock fire. Drought-dry woods, shifting winds and steep terrain fueled a fast spread, but it is now stopped at about 5.8 acres with no public threat.
