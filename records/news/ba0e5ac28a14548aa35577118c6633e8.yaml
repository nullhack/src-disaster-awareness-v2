title: Trump plans to meet separately with Putin on his China trip in addition to their 3-way talks with Xi
body: A U.S. official says President Donald Trump plans to meet separately with Russian President Vladimir Putin on Thursday in China, in addition to their already scheduled three-way meeting with Chinese President Xi Jinping.
