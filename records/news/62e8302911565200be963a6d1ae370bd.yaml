title: இந்து சமுத்திரத்தில் 6.5 மெக்னிடியூட் நிலநடுக்கம் ; இலங்கைக்கு சுனாமி அச்சுறுத்தல் இல்லை! | Virakesari.lk
body: A magnitude 6.5 earthquake was recorded on Tuesday (24) afternoon in the Indian Ocean region between Mauritius and Réunion, according to the Department of Meteorology’s National Tsunami Warning Centre.
