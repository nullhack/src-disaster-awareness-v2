title: Magnitude 6.6 earthquake strikes off Indonesia's Tual
body: A magnitude 6.6 earthquake struck off the coast of Indonesia on Monday, according to the United States Geological Survey (USGS). The quake occurred approximately 148 kilometers (92 miles) west-southwest of Tual at a depth of 68 kilometers (42 miles). There was no immediate information on casualties, damage or possible tsunami warnings.
