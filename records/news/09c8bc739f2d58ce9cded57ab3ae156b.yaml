title: 'One-way restraint: what is the danger of Kushner''s praise of "Grandmaster Putin": EADaily'
body: EADaily, November 26th, 2026. Russian President Vladimir Putin has agreed not to use nuclear weapons, although negotiations on the territorial issue have reached a complete impasse. This was stated by the special representative and son-in-law of the US President Jared Kushner to the head of the Axel Springer media concern Mathias Depfner.
