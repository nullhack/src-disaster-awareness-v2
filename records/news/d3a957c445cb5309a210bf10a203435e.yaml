title: 'ഇക്വഡോറിൽ ഡെങ്കിപ്പനി: രോഗബാധിതർ 43,000 കടന്നു'
body: 'ക്വിറ്റോ: എൽ നിനോ പ്രതിഭാസത്തെ തുടർന്നുണ്ടായ കനത്ത മഴയും വെള്ളപ്പൊക്കവും ഇക്വഡോറിൽ ഡെങ്കിപ്പനി വ്യാപനം രൂക്ഷമാക്കുന്നു. രാജ്യത്ത് ഡെങ്കിപ്പനി ബാധിതരുടെ എണ്ണം 43,000 കടന്നതായി മെഡിക്കൽ സംഘടനകൾ…'
