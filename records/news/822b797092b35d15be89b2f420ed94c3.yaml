title: The Making of a Global Hunger Crisis | Council on Foreign Relations
body: Global conflict has threatened three critical maritime corridors simultaneously, interrupting vital flows of fuel, food, and fertilizer. Now, a record-breaking El Niño event is looking to make things worse. International donors and multinational organizations need to act early to prevent a worst-case scenario.
