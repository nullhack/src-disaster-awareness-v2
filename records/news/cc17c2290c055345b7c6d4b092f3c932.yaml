title: Inday weakens into a typhoon, Signal No. 1 remains over 12 areas
body: Super Typhoon Inday weakens into a typhoon as it continues to move west northwestward as Signal No. 1 is hoisted over 12 areas, according to the latest Tropical Cyclone Bulletin posted by PAGASA.
