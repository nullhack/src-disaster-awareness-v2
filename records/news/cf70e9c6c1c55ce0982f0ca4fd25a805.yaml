title: 'Premier cas humain d’infection à Shamonda : ce que l’on sait et ce que l’on ignore'
body: Considéré jusqu’ici comme non transmissible à l’Homme, le virus Shamonda a été détecté pour la première fois chez un être humain, un patient hospitalisé en France.
