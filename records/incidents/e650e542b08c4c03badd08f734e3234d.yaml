summary: Amnesty International published a report on the gendered dimensions of Israel’s military offensive in Gaza, stating that Israeli forces have killed thousands of women and girls and deprived them of essential healthcare and conditions for survival. Gaza’s municipalities warned that winter rains threaten about 1,000 shelter sites and that roughly 200,000 tents need replacing, while the EU urged Israel to reopen all crossings. Separately, Israeli strikes killed eight Palestinians in Gaza, according to health officials.
