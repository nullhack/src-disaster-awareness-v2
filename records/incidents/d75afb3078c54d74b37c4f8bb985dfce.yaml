summary: |-
  Southern Malawi’s drought crisis is compounding with aid cuts after COP31 failed to provide answers, leaving 2.6 million people hungry. In the U.S., the Allentown-area water utility urged customers to cut consumption by 10–15%, exceptional drought expanded across Mississippi and Arkansas, and receding Jordan Lake levels exposed remnants of submerged communities; Wisconsin cranberry growers and Czech carp harvests also reported drought-related losses. A winter outlook suggested a strong El Niño could help alleviate drought conditions.
  The selected news reports Karnataka’s deputy chief minister criticizing the BJP over economic policy failures, including delays in drought relief aid, while South African cities tightened water restrictions as El Niño threatened drought. In the U.S., the SBA reminded drought victims of a loan deadline, Jackson County, Oregon remained in 100% drought with 87% of Oregon under some drought level, and Michigan’s Upper Peninsula faced wildfire risk from dry conditions; other reports highlighted IUCN nature-based drought solutions and UTA work using AI and satellites to strengthen drought resilience on Tribal lands.
