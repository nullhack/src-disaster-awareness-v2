summary: Bristol Water customers have had their hosepipe ban lifted after a 12-week restriction, while Durham has spent more than $4 million since June buying water because Lake Michie remains critically low. In the Philippines, Pagasa-Davao warned that below-normal rainfall from a very strong El Niño could push all Davao Region provinces into meteorological drought by March 2027, and Arkansas entered duck season with low river levels and little relief forecast. Other reports described drought-related wildlife rescue in Italy and a donor adoption scheme for drought-hit villages in Jalna, India.
