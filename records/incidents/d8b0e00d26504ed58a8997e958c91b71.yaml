summary: Selected reports describe El Niño-driven rains causing major flooding in cities across Peru and Ecuador, with rivers overflowing in northern Peru and coastal Ecuador. In Ecuador, heavy rain and a 4.50 m high tide flooded Guayaquil on 25 November, with Segura EP reporting 41 affected points by 21:00 ahead of local elections. One report also states that flooding in Ecuador has killed 30 people and affected 121,000 residents.
