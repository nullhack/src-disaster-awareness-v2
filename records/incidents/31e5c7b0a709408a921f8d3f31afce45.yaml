summary: |-
  Retired Colonel General Leonid Ivashov told Vladimir Putin on air that he had "lost" Ukraine and demanded an immediate ceasefire, a rare public challenge from within Russia's military. Zelenskyy hailed a Ukrainian operation that struck a Russian warship docked at a naval base in Libya and destroyed a military helicopter. Meanwhile, reporting described Trump continuing military operations against Iran, including a strike on Qeshm Island, despite Democrats taking control of Congress.
  Drone strikes damaged homes and a UN facility in Khartoum, while the U.S. government investigated suspected Iranian ties to the hacking of as many as 50 commercial vessels amid the war with Iran. Moscow threatened a NATO member with “open war” over Estonia’s planned border closure, and leaked data suggested over 700,000 Russian troops have been killed in Ukraine since the invasion. Vance and Rubio met with Qatar’s prime minister as uncertainty mounted over Trump’s intentions toward Iran.
