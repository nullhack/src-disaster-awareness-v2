summary: Multiple outlets reported a magnitude 6.5 earthquake in the Vanuatu Islands Region at a depth of about 614–615 kilometers. PHIVOLCS said there was no tsunami threat to the Philippines, and there were no immediate reports of casualties or damage. One report also noted a magnitude 4.9 earthquake in the same area and described shaking felt in Port Vila.
