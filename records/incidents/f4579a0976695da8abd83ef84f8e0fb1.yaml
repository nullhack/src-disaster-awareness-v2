summary: Hillsborough County’s dengue case growth has slowed as its local emergency approaches expiration around Thanksgiving. Bangladesh reported two more dengue deaths and 1,152 new hospital admissions, raising the toll to 526, while Malaysia reported a significant decline in dengue cases and deaths in 2025 despite more floods. Hong Kong’s Centre for Health Protection reported new dengue and chikungunya cases and urged the public to prevent mosquito bites and breeding.
