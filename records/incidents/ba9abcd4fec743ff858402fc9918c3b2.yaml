summary: Heavy fighting near a hospital in Ituri province disrupted Ebola response efforts and forced emergency teams to take cover for more than 24 hours, according to WHO. WHO chief Tedros Adhanom Ghebreyesus said an Ebola team was temporarily evacuated from a hospital in Akwe after fierce conflict lasted over three days, and he called for peace. WHO also warned of a high death rate among children amid an outbreak of the rare Bundibugyo version of Ebola in DR Congo.
