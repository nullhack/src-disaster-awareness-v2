summary: Washington's military campaign against Iran has cost an estimated $48.3 billion while delivering a $21.6 billion windfall to nine African fossil-fuel exporters, and a new report projected the war will cost Gulf states $790 billion by 2030, including $200 billion in physical damage. President Trump is reportedly weighing postponing renewed strikes despite Israeli pressure for a joint campaign, even as he said Iranian attacks spiked over the past week and warned of possible new strikes next year, while Iran's foreign ministry vowed to use "all available means" against the US naval blockade and linked safe Strait of Hormuz passage to its conditions. In Washington, Senate Republicans signaled openness to a spending deal that would cut off war funding to avert a shutdown, Secretary of State Rubio prepared to meet Qatar's prime minister, and oil prices fell on rising Middle East flows and a Libyan pipeline restart.
