summary: President Trump told U.S. troops that victory over Iran was “within reach” and said the war would end “sort of whenever I want it to be,” while leaving open the possibility of negotiations. A drone attack on a Kuwaiti military facility killed two Italian nationals; Iran denied responsibility and its foreign minister called the incident suspicious and possibly a pretext for war. Iran also warned that resumed U.S. attacks would bring new air-defense systems, and Brent held near a month high as tanker attacks and strikes on Saudi energy infrastructure raised supply concerns.
