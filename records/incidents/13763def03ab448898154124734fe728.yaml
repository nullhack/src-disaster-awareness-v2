summary: |-
  The USS Theodore Roosevelt arrived in the Middle East as a third U.S. aircraft carrier while Iran escalated threats and a tanker was struck in the Strait of Hormuz. Bahrain was rattled by a second Iranian drone attack, and U.S. intelligence reports said Iran was developing plans to detonate a dirty bomb in Washington and target senior Trump administration officials. Political fallout continued as a whistleblower alleged the Pentagon ignored warnings before a Kuwait drone attack killed six U.S. service members, Trump attacked CBS over its report, and JD Vance promised the war would not become a “forever war” and would end by 2028.
  Iran fired multiple one-way attack drones at a US radar facility at Sheikh Isa air base in Bahrain, described as a third round of strikes ending a roughly two-month lull; US Central Command said the drones were intercepted and US forces retaliated against Iranian targets along a key shipping route. Reporting on US intelligence alleging Iranian plans to detonate a "dirty bomb" in Washington targeting senior officials drew a warning from President Trump that Iran would pay a "major price," while a US lawmaker dismissed the threat as intimidation. Photographs published by Iranian media also suggested US forces may have used graphite "blackout bombs" against Iranian infrastructure in recent days.
