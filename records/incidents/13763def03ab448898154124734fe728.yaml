summary: 'Reporting this batch focuses on Washington politics rather than the fighting: a group of Democrats is said to be closing in on a proposal that would cut off funding for the Iran war as part of a spending deal intended to avert a shutdown, drawing pushback from Republicans such as Rep. Andy Harris, who argued that defunding the campaign would hand Iran a victory. Separately, Vice President JD Vance declined to endorse President Trump''s Iran strikes despite having earlier blamed the war for the GOP''s midterm losses. Other items in the batch were peripheral, including a swim in the Strait of Hormuz staged to highlight environmental threats to wildlife and a commentary arguing the war will not transform global energy.'
