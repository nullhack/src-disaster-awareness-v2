summary: British Columbia's largest long COVID clinic has laid off most of its staff and scaled back its programs following provincial billing changes that took effect Nov. 1, when the Medical Services Commission introduced a 30-person limit on online group visits. Separately, New York's state health commissioner urged residents to get seasonal immunizations as flu activity spikes, noting that more than 1,000 New Yorkers died from flu and COVID combined last year. Guidance on receiving COVID-19 and flu shots at the same time was also recirculated but repeats information already covered.
