summary: |-
  CNN reports that American farmers are being squeezed by extreme drought compounded by steep fuel and fertilizer costs and the loss of a key outlet for surplus crops — the US foreign food-aid market. The combination has weakened the bottom line for many growers, linking drought conditions to both domestic farm finances and reduced overseas food assistance.
  The Cebu Provincial Government is considering tapping treatment plants in Barili and Malabuyoc to refill water trucks as the ongoing El Niño is expected to worsen. In the UK, councillors warned that the Havant Thicket reservoir water recycling scheme may still not be enough to tackle water shortages, criticizing Southern Water's record. Separately, the last-minute collapse of the COP31 climate talks left vulnerable countries facing what charities described as grim El Niño consequences.
