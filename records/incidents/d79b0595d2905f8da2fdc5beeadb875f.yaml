summary: Corpus Christi has leaned heavily on groundwater to get through the worst of its drought, with experts cautioning against prolonged well dependence, while Germany pledged about US$3.2 million for emergency boreholes in drought-stressed Namibia. Hawaii will launch a free monthly climate portal on July 1 giving residents localized rainfall and drought updates, and global wine production is projected at 225 million hectolitres in 2026 — roughly 7% below the five-year average — as Italy recorded its second-smallest harvest this century. Northwest Colorado is meanwhile waiting to see whether snowfall can pull the region out of storage deficits and drought.
