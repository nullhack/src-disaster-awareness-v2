summary: The mpox outbreak in Africa remains uncontrolled, with the Africa CDC warning that cases are still rising. In response, Gavi has agreed to purchase 500,000 doses of Bavarian Nordic's mpox vaccine to help combat the outbreak. The World Health Organization has also emphasized the need for a collaborative response, particularly in the Democratic Republic of the Congo.
