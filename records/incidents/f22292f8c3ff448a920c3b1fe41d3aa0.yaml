summary: |-
  Ukraine struck the Crimean Bridge again in what was described as a third blow, with Kyiv saying the attacks were carried out without Musk’s Starlink; Musk separately accused Zelenskyy of lying about Starshield restrictions. Two major Russian oil refineries were struck on the eve of a Trump-Putin-Xi summit, and a report said employees of Dutch arms maker Destinus took part in the war. Russian attacks have left Kyiv with devastating power outages, with Mayor Vitali Klitschko facing blame.
  Trump, Xi and Putin held their trilateral summit on the sidelines of APEC in Shenzhen, with Trump saying the US and China want to help end the Ukraine war and declaring the three were "really making history," though reporting described a diplomatic milestone without breakthroughs, and Trump used the occasion to call the ICC "out of control." Putin threatened a "painful response" after Kyiv struck the Crimean Bridge for a third time, while Russia's embassy in the Netherlands asked whether Amsterdam had joined the conflict over Dutch-made missiles used in the attack. Separately, Pentagon policy chief Elbridge Colby drew pushback from Germany and Britain after telling NATO allies that Ukraine's deep strikes inside Russia have not shortened the war, Brussels urged European households to be ready to survive 72 hours alone, and UK PM Andy Burnham said Europe is "ready to enter negotiations."
