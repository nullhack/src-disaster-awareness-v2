summary: |-
  Bombings in Moscow and St. Petersburg killed a Russian military officer and critically injured an adviser to Ukraine's former prime minister. Diplomatic moves include a planned trilateral Trump–Xi–Putin meeting at the APEC summit in Shenzhen and a reported U.S. proposal to grant Ukraine NATO membership in exchange for surrendering the Donbas region to Russia. Russia has also presented a document demanding NATO withdraw to its 1997 borders, and an article examines hybrid warfare tactics linked to Russia across Europe.
  Prince Harry traveled to Ukraine for a conference on war trauma. President Zelensky said Starshield restrictions are helping Russia carry out attacks on Ukraine's energy infrastructure. Meanwhile, arrests in South Africa linked to the war suggest the country may be serving as a transit route for Russia's operations.
