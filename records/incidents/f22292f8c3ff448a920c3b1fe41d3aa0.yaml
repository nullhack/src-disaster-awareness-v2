summary: |-
  President Trump said Putin is "backing down a bit" on Ukraine, adding that the Russian leader "could have been much tougher." Trump is traveling to China, where he plans to discuss limiting nuclear weapons and ending the war in Ukraine with Xi Jinping and Putin. Separately, Ukrainian paratroopers have converted a 2007 Land Rover Freelander into a remote-controlled war machine that is already in service.
  On November 18 the European Commission proposed a €45 billion loan to Ukraine, to be repaid once Russia pays reparations, with Ursula von der Leyen urging all 27 member states to back it to avert a cash crisis and give Kyiv a "strong hand" in negotiations. Ahead of a Trump–Putin–Xi meeting in China — with Trump also planning a separate one-on-one with Putin — U.S. allies rejected Washington's criticism of Ukrainian deep strikes inside Russia, while Russia was reported to be expanding its ballistic and cruise missile arsenal and, according to an EU commissioner citing Ukrainian forecasts, preparing to launch 20 million drones at Ukraine in 2027. Separately, Russia's embassy in the Netherlands asked whether Amsterdam had joined the war after a Dutch-based company said its missiles were used in the Crimea bridge attack, Ukraine criticized an IAEA plan to appoint a sanctioned Russian official, and freshwater shortages deepened in occupied Crimea.
