summary: |-
  Leaked Russian civil registration records revealed the deaths of 23 Zimbabwean men who fought in the war against Ukraine, with most killed in Donetsk Oblast where fighting has been most intense. President Zelenskyy said the new U.S. Congress should force Putin to end the war if Trump's peace push fails, saying Washington appears politically to be "pursuing the same course as Putin." Reporting also documented how electricity and water shortages have become part of daily life in Ukraine's capital.
  Ukrainian President Volodymyr Zelenskyy voiced frustration with Washington's posture toward Moscow, calling President Trump's description of Putin as "my friend" strange and urging the US to apply pressure on Russia. Ukraine separately reported its first downing of a Russian jet-powered Geran/Shahed drone using the domestically developed Blysk 4-kilowatt laser air-defense system. Trump, meanwhile, said he pressed Putin to pull back military aggression across Europe and claimed Putin wants a peace agreement, describing mutual personal hostility between Putin and Zelenskyy as the main obstacle.
