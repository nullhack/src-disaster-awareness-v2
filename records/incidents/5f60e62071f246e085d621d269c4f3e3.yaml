summary: AccuWeather warned that slow, heavy storms could soak eastern and southern Florida with 2 to 8 inches of rain this week, raising the risk of flooding. A flood watch was issued for Orange and Osceola counties, including the Walt Disney World area, from Tuesday, November 17, through Friday, November 20, with 3 to 6 inches of rain likely and up to 12 inches possible. Other items in the batch cover separate events, including Cyclone Akvan in India and California coastal wave impacts.
