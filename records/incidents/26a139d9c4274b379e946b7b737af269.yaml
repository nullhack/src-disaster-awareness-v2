summary: Nearly three months after the Bhotekoshi flood, scholarships for affected students are being delayed by a lack of verified data, while resettlement efforts face challenges beyond simply providing new homes. Nepal’s inflation reached a 36-month high amid supply disruptions following the Aug. 26 floods and landslides, and relief continues through aid to the family of a missing flood victim as well as rebuilding work led by women survivors and aid workers.
