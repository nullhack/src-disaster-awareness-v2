summary: |-
  Nepal has begun the formal process to declare 213 missing Indian nationals dead from the August 26 floods, with the Indian Embassy urging families to review the published list and submit objections by December 2. Malaysian officials said certificates of presumed death for their missing citizens will be issued once Nepal's confirmation and documents arrive. Separately, Sonoma's Sherpa community raised more than $100,000 for flood relief, and a commentary argued that most current analysis of the Bhotekoshi flooding overlooks the distinctive conditions of Himalayan settlements.
  Nepal has verified details of 452 missing foreign nationals from 12 countries — including 213 Indians, 85 Chinese and 69 Americans — with India's embassy asking families to review the published list and file objections by December 2. Malaysian authorities said death certificates for the 54 missing Malaysians will follow once Nepal provides official confirmation. Three months on, survivors also returned to a Hindu temple destroyed by the floods to honour the dead, while commentary framed India's swift aid and reconstruction grants as an effort to rebuild influence in Kathmandu.
