summary: On June 8, 2026, a 6.1 magnitude earthquake struck off the coast of Cuba near Mantua and was widely felt across Florida, causing temporary closures of some rides at Disney World. The quake is among the strongest ever recorded in the Gulf of Mexico. A 4.9 aftershock was reported a week later in the same area.
