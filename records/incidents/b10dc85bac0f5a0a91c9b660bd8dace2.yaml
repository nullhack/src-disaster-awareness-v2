summary: The first cases of H5N1 bird flu have been detected in Australian seabirds. A confirmed case was found in a brown skua in Cape Le Grand, Western Australia, and a suspected case in a giant petrel near Hawks Nest, New South Wales. Additionally, CSIRO lab testing confirmed the strain in a greater crested tern.
